  <meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
  <style>
    :root {
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)

    html {

<body>
  <title>Jawad Ul Hadi Fact Sheet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Sans:wght@400..700&family=Martian+Mono:wght@400..600&display=swap">
  <style>

    :after {
      box-sizing: border-box;
      border-style: solid;
      border-width: 0;
      border-color: var(--line)

    }

    html,
    :host {
      -webkit-text-size-adjust: 100%;
      tab-size: 4;
      font-feature-settings: normal;
      font-variation-settings: normal;
      -webkit-tap-highlight-color: transparent;

      line-height: 1.5

    body {
      line-height: inherit;
      margin: 0

    hr {

    h2,
    h3,
    h4,
    h5,
    h6 {

      font-weight: inherit

    a {
      color: inherit;
      text-decoration: inherit

    b,
    strong {
      font-weight: bolder
    }

    code,
    kbd,
    samp,
    pre {
      font-feature-settings: normal;
      font-variation-settings: normal;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, Courier New, monospace;
      font-size: 1em
    }

    small {
      font-size: 80%
    }

    sub,
    sup {
      vertical-align: baseline;
      font-size: 75%;
      line-height: 0;
      position: relative
    }

    sub {
      bottom: -.25em
    }

    sup {
      top: -.5em
    }

    table {
      text-indent: 0;
      border-color: inherit;
      border-collapse: collapse
    }

    button,
    input,
    optgroup,
    select,
    textarea {
      font-feature-settings: inherit;
      font-variation-settings: inherit;
      font-family: inherit;
      font-size: 100%;
      font-weight: inherit;
      line-height: inherit;
      color: inherit;
      margin: 0;
      padding: 0
    }

    button,
    select {
      text-transform: none
    }

    button,
    [type=button],
    [type=reset],
    [type=submit] {
      -webkit-appearance: button;
      background-color: #0000;
      background-image: none
    }

    :-moz-focusring {
      outline: auto
    }

    :-moz-ui-invalid {
      box-shadow: none
    }

    progress {
      vertical-align: baseline
    }

    ::-webkit-inner-spin-button {
      height: auto
    }

    ::-webkit-outer-spin-button {
      height: auto
    }

    [type=search] {
      -webkit-appearance: textfield;
      outline-offset: -2px
    }

    ::-webkit-search-decoration {
      -webkit-appearance: none
    }

    ::-webkit-file-upload-button {
      -webkit-appearance: button;
      font: inherit
    }

    summary {
      display: list-item
    }

    blockquote,
    dl,
    dd,
    h1,
    h2,
    h3,
    h4,
    h5,
    h6,
    hr,
    figure,
    p,
    pre {
      margin: 0
    }

    fieldset {
      margin: 0;
      padding: 0
    }

    legend {
      padding: 0
    }

    ol,
    ul,
    menu {
      margin: 0;
      padding: 0;
      list-style: none
    }

    dialog {
      padding: 0
    }

    textarea {
      resize: vertical
    }

    input::placeholder,
    textarea::placeholder {
      opacity: 1;
      color: #9ca3af
    }

    button,
    [role=button] {
      cursor: pointer
    }

    :disabled {
      cursor: default
    }

    img,
    svg,
    video,
    canvas,
    audio,
    iframe,
    embed,
    object {
      vertical-align: middle;
      display: block
    }

    img,
    video {
      max-width: 100%;
      height: auto
    }

    [hidden] {
      display: none
    }

      --tw-ring-color: #3b82f680;
      --tw-ring-offset-shadow: 0 0 #0000;
      --tw-ring-shadow: 0 0 #0000;
      --tw-shadow: 0 0 #0000;
      --tw-shadow-colored: 0 0 #0000;
      --tw-blur: ;
      --tw-brightness: ;
      --tw-contrast: ;

    .sr-only {
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      position: absolute;
      overflow: hidden
    }

    .z-50 {
      z-index: 50
    }

    .mt-0 {
      margin-top: 0
    }

    .mt-2 {
      margin-top: .5rem
    }

    .block {
      display: block
    }

    .inline-flex {
      display: inline-flex
    }

    .h-9 {
      height: 2.25rem
    }

    .origin-\[--radix-tooltip-content-transform-origin\] {
      transform-origin: var(--radix-tooltip-content-transform-origin)
    }

    .items-center {
      align-items: center
    }

    .justify-center {
      justify-content: center
    }

    .overflow-hidden {
      overflow: hidden
    }

    .whitespace-nowrap {
      white-space: nowrap
    }

    .rounded-lg {
      border-radius: .5rem
    }

    .rounded-md {
      border-radius: .375rem
    }

    .bg-muted {
      background-color: hsl(var(--muted))
    }

    .bg-primary {
      background-color: hsl(var(--primary))
    }

    .p-1 {
      padding: .25rem
    }

    .px-3 {
      padding-left: .75rem;
      padding-right: .75rem
    }

    .py-1 {
      padding-top: .25rem;
      padding-bottom: .25rem
    }

    .py-1\.5 {
      padding-top: .375rem;
      padding-bottom: .375rem
    }

    .text-sm {
      font-size: .875rem;
      line-height: 1.25rem
    }

    .text-xs {
      font-size: .75rem;
      line-height: 1rem
    }

    .font-medium {
      font-weight: 500
    }

    .text-muted-foreground {
      color: hsl(var(--muted-foreground))
    }

    .text-primary-foreground {
      color: hsl(var(--primary-foreground))
    }

    .ring-offset-background {
      --tw-ring-offset-color: hsl(var(--background))
    }

    .filter {
      filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow)
    }

    .transition-all {
      transition-property: all;
      transition-duration: .15s;
      transition-timing-function: cubic-bezier(.4, 0, .2, 1)
    }

    @keyframes enter {
      0% {
        opacity: var(--tw-enter-opacity, 1);
        transform: translate3d(var(--tw-enter-translate-x, 0), var(--tw-enter-translate-y, 0), 0) scale3d(var(--tw-enter-scale, 1), var(--tw-enter-scale, 1), var(--tw-enter-scale, 1)) rotate(var(--tw-enter-rotate, 0))
      }
    }

    @keyframes exit {
      to {
        opacity: var(--tw-exit-opacity, 1);
        transform: translate3d(var(--tw-exit-translate-x, 0), var(--tw-exit-translate-y, 0), 0) scale3d(var(--tw-exit-scale, 1), var(--tw-exit-scale, 1), var(--tw-exit-scale, 1)) rotate(var(--tw-exit-rotate, 0))
      }
    }

    .animate-in {
      --tw-enter-opacity: initial;
      --tw-enter-scale: initial;
      --tw-enter-rotate: initial;
      --tw-enter-translate-x: initial;
      --tw-enter-translate-y: initial;
      animation-name: enter;
      animation-duration: .15s
    }

    .fade-in-0 {
      --tw-enter-opacity: 0
    }

    .zoom-in-95 {
      --tw-enter-scale: .95
    }

    :root {
      --bg: #f2f4fa;
      --surface: #fff;
      --surface-2: #e8ecf6;
      --ink: #10162a;
      --dim: #535d77;
      --line: #d6dcea;
      --grid: #cdd4e6;
      --c-blue: #2d5bef;
      --c-teal: #0a9a8c;
      --c-amber: #c47600;
      --c-coral: #e5482e;
      --c-magenta: #cc2f86;
      --c-violet: #6b47ee;
      --c-lime: #4b9a1c;
      --ok: #148a4d;
      --bad: #d7363c;
      --on-tone: #fff;
      --shadow: 0 1px 2px #10162a0f, 0 10px 28px -14px #10162a38;
      --ease-out: cubic-bezier(.2, .8, .2, 1);
      --font-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
      --font-body: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
      --font-mono: "Martian Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
      --background: 226 45% 97%;
      --foreground: 227 45% 11%;
      --muted: 223 40% 94%;
      --muted-foreground: 224 17% 40%;
      --primary: 227 45% 11%;
      --primary-foreground: 0 0% 100%;
      --ring: 226 86% 56%;
      --border: 223 30% 88%
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme=light]) {
        --bg: #0a0f1e;
        --surface: #111930;
        --surface-2: #1a2440;
        --ink: #e9edf8;
        --dim: #9aa5c0;
        --line: #26314f;
        --grid: #1c2643;
        --c-blue: #7090ff;
        --c-teal: #2ccdbb;
        --c-amber: #f5b83d;
        --c-coral: #ff7a62;
        --c-magenta: #f168b3;
        --c-violet: #a08bff;
        --c-lime: #8ad15a;
        --ok: #3dd68c;
        --bad: #ff6369;
        --on-tone: #0a0f1e;
        --shadow: 0 1px 2px #0000004d, 0 12px 32px -16px #000000b3;
        --background: 226 50% 8%;
        --foreground: 225 50% 95%;
        --muted: 224 44% 17%;
        --muted-foreground: 223 22% 68%;
        --primary: 225 50% 95%;
        --primary-foreground: 226 50% 8%;
        --ring: 227 100% 72%;
        --border: 224 35% 23%;
        color-scheme: dark
      }
    }

    :root[data-theme=dark] {
      --bg: #0a0f1e;
      --surface: #111930;
      --surface-2: #1a2440;
      --ink: #e9edf8;
      --dim: #9aa5c0;
      --line: #26314f;
      --grid: #1c2643;
      --c-blue: #7090ff;
      --c-teal: #2ccdbb;
      --c-amber: #f5b83d;
      --c-coral: #ff7a62;
      --c-magenta: #f168b3;
      --c-violet: #a08bff;
      --c-lime: #8ad15a;
      --ok: #3dd68c;
      --bad: #ff6369;
      --on-tone: #0a0f1e;
      --shadow: 0 1px 2px #0000004d, 0 12px 32px -16px #000000b3;
      --background: 226 50% 8%;
      --foreground: 225 50% 95%;
      --muted: 224 44% 17%;
      --muted-foreground: 223 22% 68%;
      --primary: 225 50% 95%;
      --primary-foreground: 226 50% 8%;
      --ring: 227 100% 72%;
      --border: 224 35% 23%;
      color-scheme: dark
    }

    html {
      -webkit-text-size-adjust: 100%
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      margin: 0;
      font-size: 15px;
      line-height: 1.55;
      overflow-x: hidden
    }

    body:before {
      content: "";
      pointer-events: none;
      background-image: radial-gradient(var(--grid) 1px, transparent 1.3px);
      background-size: 22px 22px;
      position: fixed;
      inset: 0;
      mask-image: linear-gradient(#000 0, #0000 520px)
    }

    #root {
      position: relative
    }

    a {
      color: inherit
    }

    code {
      font-family: var(--font-mono);
      background: var(--surface-2);
      overflow-wrap: anywhere;
      border-radius: 5px;
      padding: 1px 5px;
      font-size: .82em
    }

    :focus-visible {
      outline: 2px solid var(--c-blue);
      outline-offset: 2px
    }

    q {
      quotes: "“" "”"
    }

    .wrap {
      max-width: 1180px;
      margin-inline: auto;
      padding-inline: clamp(16px, 4vw, 40px)
    }

    .section {
      border-top: 1px solid var(--line);
      padding-block: clamp(48px, 7vw, 84px)
    }

    .eyebrow {
      font-family: var(--font-mono);
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--dim);
      margin: 0;
      font-size: 10.5px;
      font-weight: 500
    }

    .display {
      font-family: var(--font-display);
      letter-spacing: -.025em;
      text-wrap: balance;
      margin: 0;
      font-weight: 800;
      font-stretch: 125%;
      line-height: .95
    }

    .h2 {
      font-family: var(--font-display);
      letter-spacing: -.015em;
      text-wrap: balance;
      margin: 6px 0 0;
      font-size: clamp(1.6rem, 1.15rem + 1.7vw, 2.35rem);
      font-weight: 750;
      font-stretch: 112%;
      line-height: 1.05
    }

    .h3 {
      font-family: var(--font-display);
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
      font-stretch: 100%;
      line-height: 1.25
    }

    .figure {
      font-family: var(--font-display);
      letter-spacing: -.03em;
      font-variant-numeric: tabular-nums;
      color: var(--tone, var(--ink));
      font-size: clamp(2.3rem, 1.9rem + 1.4vw, 3.1rem);
      font-weight: 800;
      font-stretch: 125%;
      line-height: 1;
      display: inline-block
    }

    .dim {
      color: var(--dim)
    }

    .mono-sm {
      font-family: var(--font-mono);
      font-size: 11.5px
    }

    .section-head {
      gap: 12px 40px;
      margin-bottom: clamp(24px, 4vw, 40px);
      display: grid
    }

    @media (width>=900px) {
      .section-head {
        grid-template-columns: minmax(0, 1fr) minmax(0, .9fr);
        align-items: end
      }
    }

    .section-intro {
      max-width: 52ch;
      color: var(--dim);
      margin: 0
    }

    .topbar {
      top: env(safe-area-inset-top, 0px);
      z-index: 40;
      background: color-mix(in srgb, var(--bg) 85%, transparent);
      backdrop-filter: saturate(1.4)blur(12px);
      border-bottom: 1px solid var(--line);
      position: sticky
    }

    .topbar-inner {
      align-items: center;
      gap: 12px;
      min-height: 56px;
      display: flex
    }

    .mark {
      align-items: flex-end;
      gap: 2px;
      height: 20px;
      display: inline-flex
    }

    .mark i {
      border-radius: 2px;
      width: 6px;
      display: block
    }

    .topbar-name {
      font-family: var(--font-display);
      white-space: nowrap;
      margin-right: auto;
      font-weight: 750;
      font-stretch: 112%
    }

    .tabs-list.tabs-list {
      background: var(--surface-2);
      height: auto;
      color: var(--dim);
      border-radius: 999px;
      gap: 2px;
      padding: 3px
    }

    .tab-trigger.tab-trigger {
      color: var(--dim);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 13.5px;
      font-weight: 600
    }

    .tab-trigger.tab-trigger[data-state=active] {
      background: var(--surface);
      color: var(--ink);
      box-shadow: var(--shadow)
    }

    .tab-trigger.tab-trigger:focus-visible {
      outline: 2px solid var(--c-blue);
      outline-offset: 2px;
      --tw-ring-shadow: 0 0 #0000
    }

    .source-chip {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      font-family: var(--font-mono);
      cursor: pointer;
      border-radius: 8px;
      align-items: center;
      gap: 7px;
      padding: 6px 11px;
      font-size: 11px;
      display: inline-flex
    }

    .source-chip:hover {
      border-color: var(--c-blue)
    }

    .source-chip i {
      background: var(--ok);
      width: 7px;
      height: 7px;
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent);
      border-radius: 50%
    }

    .tip.tip {
      background: var(--ink);
      max-width: 240px;
      color: var(--bg);
      font-size: 12px;
      line-height: 1.4
    }

    @media (width<=560px) {

      .source-chip,
      .topbar-name {
        display: none
      }

      .mark {
        margin-right: auto
      }
    }

    .hero {
      gap: clamp(28px, 4vw, 52px);
      padding-block: clamp(32px, 5vw, 64px) clamp(44px, 6vw, 76px);
      display: grid
    }

    @media (width>=1000px) {
      .hero {
        grid-template-columns: minmax(0, 1.02fr) minmax(0, .98fr);
        align-items: start
      }
    }

    .hero-copy {
      flex-direction: column;
      gap: 18px;
      min-width: 0;
      display: flex
    }

    .hero-name {
      margin-top: 4px;
      font-size: clamp(2.6rem, 1.2rem + 5.6vw, 5.1rem)
    }

    .ribbon-wrap {
      gap: 8px;
      max-width: 560px;
      display: grid
    }

    .ribbon {
      gap: 3px;
      height: 10px;
      display: flex
    }

    .ribbon span {
      transform-origin: 0;
      border-radius: 3px
    }

    .play .ribbon span {
      animation: grow .8s var(--ease-out) backwards;
      animation-delay: calc(var(--i) * .26s)
    }

    .ribbon-legend {
      flex-wrap: wrap;
      gap: 4px 16px;
      margin: 0;
      padding: 0;
      font-size: 12.5px;
      list-style: none;
      display: flex
    }

    .ribbon-legend li {
      align-items: center;
      gap: 6px;
      display: inline-flex
    }

    .ribbon-legend li:before {
      content: "";
      background: var(--role);
      border-radius: 2px;
      width: 8px;
      height: 8px
    }

    .ribbon-legend span {
      font-family: var(--font-mono);
      color: var(--dim);
      font-size: 10.5px
    }

    .headline {
      font-family: var(--font-display);
      flex-wrap: wrap;
      align-items: baseline;
      gap: 4px 12px;
      margin: 4px 0 0;
      font-size: clamp(1.05rem, .92rem + .6vw, 1.3rem);
      font-weight: 650;
      font-stretch: 100%;
      line-height: 1.3;
      display: flex
    }

    .headline .pipe {
      color: var(--c-magenta);
      font-weight: 400
    }

    .positioning {
      max-width: 60ch;
      color: var(--dim);
      margin: 0;
      font-size: 15.5px
    }

    .quick {
      border-block: 1px solid var(--line);
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px 24px;
      margin: 4px 0 0;
      padding-block: 14px;
      display: grid
    }

    .quick dd {
      margin: 4px 0 0;
      font-weight: 600
    }

    .quick .dim {
      font-weight: 400;
      font-family: var(--font-mono);
      font-size: 11px
    }

    .contact {
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
      display: grid
    }

    .copy-field {
      gap: 5px;
      min-width: 0;
      display: grid
    }

    .copy-row {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 10px;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 8px 8px 12px;
      display: flex
    }

    .copy-value {
      min-width: 0;
      font-family: var(--font-mono);
      overflow-wrap: anywhere;
      -webkit-user-select: all;
      user-select: all;
      font-size: 12.5px
    }

    .icon-btn {
      background: var(--surface-2);
      color: var(--ink);
      cursor: pointer;
      border: 0;
      border-radius: 7px;
      flex: none;
      align-items: center;
      gap: 5px;
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 600;
      display: inline-flex
    }

    .icon-btn:hover {
      background: color-mix(in srgb, var(--c-blue) 16%, var(--surface-2))
    }

    .link-list {
      flex-wrap: wrap;
      gap: 6px;
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex
    }

    .link-list a {
      border: 1px solid var(--line);
      background: var(--surface);
      max-width: 100%;
      transition: border-color .2s, transform .2s var(--ease-out);
      border-radius: 999px;
      align-items: center;
      gap: 7px;
      padding: 6px 10px;
      font-size: 12.5px;
      text-decoration: none;
      display: inline-flex
    }

    .link-list a:hover {
      border-color: var(--c-blue);
      transform: translateY(-2px)
    }

    .link-label {
      font-weight: 650
    }

    .link-text {
      color: var(--dim);
      font-family: var(--font-mono);
      overflow-wrap: anywhere;
      font-size: 10.5px
    }

    .gw-panel {
      border: 1px solid var(--line);
      background: var(--surface);
      min-width: 0;
      box-shadow: var(--shadow);
      border-radius: 20px;
      padding: 18px 18px 16px
    }

    .gw-head {
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      display: flex
    }

    .gw-head .h3 {
      margin-top: 4px
    }

    .gw-phases {
      gap: 4px;
      margin: 4px 0 0;
      padding: 0;
      list-style: none;
      display: flex
    }

    .gw-phases li {
      background: var(--surface-2);
      border-radius: 3px;
      width: 16px;
      height: 5px;
      transition: background .3s
    }

    .gw-phases li.on {
      background: var(--ink)
    }

    .gw-svg {
      width: 100%;
      height: auto;
      margin-block: 6px 4px;
      display: block
    }

    .gw-link {
      fill: none;
      stroke-width: 2px;
      opacity: .55;
      transition: opacity .3s
    }

    .gw-link.down {
      stroke-dasharray: 3 6;
      opacity: .8
    }

    .gw-divider {
      stroke: var(--line);
      stroke-dasharray: 2 4
    }

    .gw-node {
      fill: var(--surface-2);
      stroke: var(--line)
    }

    .gw-core {
      fill: var(--ink)
    }

    .gw-core-label {
      fill: var(--bg);
      font: 700 17px var(--font-display)
    }

    .gw-core-sub {
      fill: var(--bg);
      opacity: .7;
      font: 500 9.5px var(--font-mono)
    }

    .gw-target {
      fill: color-mix(in srgb, var(--tone) 10%, var(--surface));
      stroke: var(--tone);
      stroke-width: 1.5px;
      transition: fill .3s, stroke .3s
    }

    .gw-target.down {
      stroke-dasharray: 4 4
    }

    .gw-hit {
      fill: none;
      stroke-width: 2px;
      opacity: .45
    }

    .gw-label {
      fill: var(--ink);
      font: 650 14.5px var(--font-body)
    }

    .gw-tiny {
      fill: var(--dim);
      font: 500 10px var(--font-mono)
    }

    .gw-tiny.bad {
      fill: var(--bad)
    }

    .tiers {
      flex-wrap: wrap;
      gap: 6px 0;
      margin: 4px 0 0;
      padding: 0;
      list-style: none;
      display: flex
    }

    .tier {
      border: 1px solid color-mix(in srgb, var(--tone) 50%, var(--line));
      background: color-mix(in srgb, var(--tone) 8%, var(--surface));
      transition: background .25s, color .25s, transform .25s var(--ease-out);
      border-radius: 999px;
      align-items: center;
      padding: 5px 11px;
      font-size: 12.5px;
      font-weight: 650;
      display: inline-flex;
      position: relative
    }

    .tier:not(:last-child):after {
      content: "→";
      color: var(--dim);
      font-weight: 400;
      position: absolute;
      right: -19px
    }

    .tier:not(:last-child) {
      margin-right: 26px
    }

    .tier.on {
      background: var(--tone);
      color: var(--on-tone);
      transform: translateY(-1px)
    }

    .gw-status {
      min-height: 3em;
      color: var(--dim);
      margin: 12px 0 0;
      font-size: 13.5px
    }

    .metrics {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      display: grid
    }

    @media (width<=1080px) {
      .metrics {
        grid-template-columns: repeat(2, minmax(0, 1fr))
      }
    }

    @media (width<=640px) {
      .metrics {
        grid-template-columns: minmax(0, 1fr)
      }
    }

    .sub-head {
      margin: 34px 0 12px
    }

    .tile {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 16px;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
      padding: 18px 18px 20px;
      display: flex;
      overflow: hidden
    }

    .tile.wide {
      grid-column: span 2
    }

    @media (width<=640px) {
      .tile.wide {
        grid-column: auto
      }
    }

    .tile-top {
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      display: flex
    }

    .role-tag {
      background: color-mix(in srgb, var(--role) 13%, transparent);
      color: var(--ink);
      font-family: var(--font-mono);
      white-space: nowrap;
      border-radius: 6px;
      flex: none;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      font-size: 10px;
      font-weight: 500;
      display: inline-flex
    }

    .role-tag:before {
      content: "";
      background: var(--role);
      border-radius: 50%;
      width: 7px;
      height: 7px
    }

    .fig-row {
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 8px 18px;
      display: flex
    }

    .fig-row .phrase {
      flex: 220px
    }

    .phrase {
      text-wrap: pretty;
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.35
    }

    .tile-note {
      color: var(--dim);
      margin: auto 0 0;
      font-size: 13px
    }

    .race {
      background: var(--surface-2);
      border-radius: 12px;
      gap: 8px;
      padding: 12px;
      display: grid
    }

    .race-row {
      grid-template-columns: 48px minmax(0, 1fr) 72px;
      align-items: center;
      gap: 10px;
      display: grid
    }

    .race-name {
      font-size: 12px;
      font-weight: 600
    }

    .race-track {
      background: var(--surface);
      border-radius: 4px;
      height: 14px;
      position: relative
    }

    .race-fill {
      border-radius: 4px;
      position: absolute;
      inset: 0 auto 0 0
    }

    .race-fill.before {
      background: repeating-linear-gradient(-45deg, var(--c-coral) 0 6px, color-mix(in srgb, var(--c-coral) 75%, var(--surface)) 6px 12px)
    }

    .race-fill.after {
      background: var(--c-blue)
    }

    .race-mark {
      background: var(--ink);
      opacity: .35;
      width: 2px;
      position: absolute;
      top: -3px;
      bottom: -3px
    }

    .race-read {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      text-align: right;
      font-size: 11px
    }

    .race-read.good {
      color: var(--c-blue);
      font-weight: 600
    }

    .race-axis {
      height: 14px;
      font-family: var(--font-mono);
      color: var(--dim);
      font-size: 9.5px;
      position: relative
    }

    .race-axis span {
      position: absolute;
      top: 0;
      transform: translate(-50%)
    }

    .race-axis span:first-child {
      transform: none
    }

    .race-axis span:last-child {
      transform: translate(-100%)
    }

    .blocks {
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 4px;
      display: grid
    }

    .blk {
      background: var(--tone);
      border: 1.5px solid var(--tone);
      border-radius: 4px;
      height: 22px
    }

    .blk.cut {
      opacity: .6;
      background: 0 0;
      border-style: dashed
    }

    .play .blk.cut {
      animation: .5s backwards cut;
      animation-delay: calc(.5s + var(--i) * .14s)
    }

    .chain {
      flex-wrap: wrap;
      gap: 6px;
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex
    }

    .chain li {
      background: var(--surface-2);
      color: var(--ink);
      animation: 4.2s ease-in-out infinite sweep;
      animation-delay: calc(var(--i) * 1.1s);
      border-radius: 7px;
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 600
    }

    .pipe {
      gap: 8px;
      display: grid
    }

    .lane {
      grid-template-columns: 92px minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      display: grid
    }

    .lane-label {
      font-family: var(--font-mono);
      color: var(--dim);
      font-size: 10px
    }

    .lane-track {
      background: var(--surface-2);
      border-radius: 10px;
      position: relative;
      overflow: hidden
    }

    .lane-track.api {
      height: 30px
    }

    .lane-track.jobs {
      height: 70px
    }

    .req,
    .job {
      transform: translateX(var(--x));
      animation: linear infinite flowX;
      position: absolute;
      inset: 0
    }

    .req {
      animation-duration: .9s;
      right: 70px
    }

    .req i {
      background: var(--c-teal);
      border-radius: 6px;
      width: 22px;
      height: 12px;
      position: absolute;
      top: 9px;
      left: 0
    }

    .lane-end {
      background: var(--surface);
      font-family: var(--font-mono);
      color: var(--c-teal);
      border-radius: 6px;
      padding: 2px 7px;
      font-size: 10px;
      font-weight: 600;
      position: absolute;
      top: 50%;
      right: 6px;
      transform: translateY(-50%)
    }

    .job i {
      border-radius: 2px;
      width: 7px;
      height: 7px;
      position: absolute;
      left: 0
    }

    .tenants {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 5px;
      display: grid
    }

    .tenant {
      border: 2px solid var(--tone);
      background: color-mix(in srgb, var(--tone) 9%, var(--surface));
      border-radius: 9px;
      height: 78px;
      position: relative;
      overflow: hidden
    }

    .tenant-name {
      font-family: var(--font-mono);
      color: var(--dim);
      font-size: 9px;
      position: absolute;
      top: 4px;
      left: 6px
    }

    .tenant i {
      left: var(--x);
      top: var(--y);
      background: var(--tone);
      border-radius: 50%;
      width: 8px;
      height: 8px;
      animation-name: roamX, roamY;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
      animation-direction: alternate;
      position: absolute
    }

    .mentor {
      width: 100%;
      max-width: 240px;
      height: auto;
      display: block
    }

    .mentor line {
      stroke-width: 2px;
      stroke-dasharray: 4 5;
      animation: 1.2s linear infinite dash
    }

    .mentor-lead {
      fill: var(--tone)
    }

    .months {
      grid-template-columns: repeat(22, minmax(0, 1fr));
      gap: 3px;
      display: grid
    }

    .months span {
      background: var(--tone);
      height: 30px;
      animation: 2.6s ease-in-out infinite glow;
      animation-delay: calc(var(--i) * .11s);
      border-radius: 3px
    }

    .months-axis {
      font-family: var(--font-mono);
      color: var(--dim);
      justify-content: space-between;
      font-size: 10px;
      display: flex
    }

    .retrieval {
      flex-wrap: wrap;
      align-items: center;
      gap: 16px 26px;
      height: 100%;
      display: flex
    }

    .retrieval-copy {
      flex-direction: column;
      flex: 220px;
      gap: 10px;
      min-width: 0;
      display: flex
    }

    .gauge {
      width: 190px;
      max-width: 100%;
      height: auto
    }

    .gauge-track,
    .gauge-fill {
      fill: none;
      stroke-width: 16px;
      stroke-linecap: round
    }

    .gauge-track {
      stroke: var(--surface-2)
    }

    .gauge-fill {
      stroke: var(--tone)
    }

    .play .gauge-fill {
      animation: arc 1.4s var(--ease-out) backwards
    }

    .gauge-tick {
      fill: var(--dim);
      font: 500 8.5px var(--font-mono)
    }

    .trace {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 16px;
      padding: 16px 18px 10px
    }

    .trace-row {
      width: 100%;
      min-height: 46px;
      color: inherit;
      font: inherit;
      text-align: left;
      background: 0 0;
      border: 0;
      grid-template-columns: minmax(118px, 240px) minmax(0, 1fr);
      align-items: center;
      gap: 14px;
      padding: 0;
      display: grid
    }

    .trace-btn {
      cursor: pointer;
      border-radius: 8px
    }

    .trace-btn:hover .trace-bar {
      filter: brightness(1.08);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--role) 25%, transparent)
    }

    .trace-head {
      border-bottom: 1px solid var(--line);
      min-height: 28px
    }

    .trace-label {
      min-width: 0;
      font-size: 13.5px;
      line-height: 1.3;
      display: grid
    }

    .trace-label strong {
      font-weight: 650
    }

    .trace-label .dim {
      font-family: var(--font-mono);
      font-size: 10px
    }

    .trace-lane {
      height: 20px;
      display: block;
      position: relative
    }

    .trace-lane.axis {
      font-family: var(--font-mono);
      color: var(--dim);
      font-size: 10px
    }

    .tick {
      position: absolute;
      top: 3px;
      transform: translate(-50%)
    }

    .trace-body {
      position: relative
    }

    .trace-grid {
      pointer-events: none;
      grid-template-columns: minmax(118px, 240px) minmax(0, 1fr);
      column-gap: 14px;
      display: grid;
      position: absolute;
      inset: 0
    }

    .trace-grid-lines {
      position: relative
    }

    .trace-grid i {
      background: var(--line);
      width: 1px;
      position: absolute;
      top: 0;
      bottom: 0
    }

    .trace-bar {
      background: var(--role);
      transform-origin: 0;
      border-radius: 5px;
      transition: box-shadow .2s, filter .2s;
      display: block;
      position: absolute;
      top: 0;
      bottom: 0
    }

    .trace-bar.root {
      background: repeating-linear-gradient(90deg, var(--c-amber) 0 33%, var(--c-teal) 33% 56%, var(--c-blue) 56% 100%);
      opacity: .35
    }

    .play .trace-bar {
      animation: grow .9s var(--ease-out) backwards;
      animation-delay: calc(var(--i) * .2s)
    }

    .trace-now {
      background: var(--role);
      border: 2px solid var(--surface);
      border-radius: 50%;
      width: 10px;
      height: 10px;
      margin-top: -5px;
      position: absolute;
      top: 50%;
      right: -5px
    }

    .trace-now:after {
      content: "";
      border: 2px solid var(--role);
      border-radius: 50%;
      animation: 1.8s ease-out infinite ping;
      position: absolute;
      inset: -2px
    }

    @media (width<=640px) {
      .tick.odd {
        display: none
      }
    }

    .spans {
      margin-top: 30px;
      display: grid
    }

    .span {
      border-top: 1px solid var(--line);
      gap: 18px 40px;
      padding-block: 28px;
      scroll-margin-top: 80px;
      display: grid
    }

    @media (width>=860px) {
      .span {
        grid-template-columns: minmax(0, 300px) minmax(0, 1fr)
      }
    }

    .span-meta {
      align-content: start;
      gap: 4px;
      min-width: 0;
      display: grid
    }

    .span-meta p {
      margin: 0
    }

    .span-dates {
      font-family: var(--font-mono);
      align-items: center;
      gap: 8px;
      font-size: 11.5px;
      display: inline-flex
    }

    .span-dates i {
      background: var(--role);
      border-radius: 3px;
      width: 22px;
      height: 8px
    }

    .span-title {
      font-family: var(--font-display);
      margin: 6px 0 0;
      font-size: 1.45rem;
      font-weight: 750;
      font-stretch: 112%;
      line-height: 1.1
    }

    .span-employer {
      font-weight: 600
    }

    .metric-chips {
      flex-wrap: wrap;
      gap: 6px;
      margin: 12px 0 0;
      padding: 0;
      list-style: none;
      display: flex
    }

    .metric-chips li {
      border: 1px solid color-mix(in srgb, var(--role) 45%, var(--line));
      background: color-mix(in srgb, var(--role) 7%, var(--surface));
      border-radius: 8px;
      padding: 4px 9px;
      font-size: 12px;
      line-height: 1.35
    }

    .systems {
      gap: 22px 28px;
      min-width: 0;
      display: grid
    }

    @media (width>=700px) {
      .systems {
        grid-template-columns: repeat(2, minmax(0, 1fr))
      }

      .systems.odd>:first-child {
        grid-column: 1/-1
      }
    }

    .system {
      min-width: 0
    }

    .system h4 {
      flex-wrap: wrap;
      align-items: baseline;
      gap: 4px 10px;
      margin: 0;
      font-size: 15.5px;
      font-weight: 700;
      display: flex
    }

    .kind {
      font-family: var(--font-mono);
      color: var(--dim);
      font-size: 10px;
      font-weight: 500
    }

    .system ul {
      gap: 7px;
      margin: 10px 0 0;
      padding: 0;
      list-style: none;
      display: grid
    }

    .systems.odd>:first-child ul {
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      column-gap: 28px
    }

    .system li {
      max-width: 65ch;
      padding-left: 18px;
      position: relative
    }

    .system li:before {
      content: "";
      background: var(--role);
      border-radius: 2px;
      width: 8px;
      height: 8px;
      position: absolute;
      top: .6em;
      left: 0
    }

    .skill-groups {
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px 34px;
      display: grid
    }

    .skill-group header {
      border-bottom: 2px solid var(--tone);
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      display: flex
    }

    .skill-group header i {
      background: var(--tone);
      border-radius: 3px;
      width: 12px;
      height: 12px
    }

    .skill-group .count {
      font-family: var(--font-mono);
      color: var(--dim);
      margin-left: auto;
      font-size: 11px
    }

    .chips {
      flex-wrap: wrap;
      gap: 6px;
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex
    }

    .chip {
      border: 1px solid color-mix(in srgb, var(--tone) 40%, var(--line));
      background: color-mix(in srgb, var(--tone) 8%, var(--surface));
      transition: background .2s, transform .2s var(--ease-out);
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 13px
    }

    .chip:hover {
      background: color-mix(in srgb, var(--tone) 24%, var(--surface));
      transform: translateY(-2px)
    }

    .play .chip {
      animation: .5s cubic-bezier(.2, .9, .3, 1.25) backwards pop;
      animation-delay: calc(var(--i) * 30ms)
    }

    .creds {
      gap: 32px 48px;
      display: grid
    }

      .creds {
        grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr)
      }
    }

    .creds-left {
      align-content: start;
      gap: 26px;
      min-width: 0;
      display: grid
    }

    .degree {
      gap: 4px;
      display: grid
    }

    .degree p {
      margin: 0
    }

    .degree-name {
      font-family: var(--font-display);
      font-size: 1.45rem;
      font-weight: 750;
      font-stretch: 112%;
      line-height: 1.1;
      margin-top: 6px !important
    }

    .resume-certs {

      margin: 10px 0 0;
      padding: 0;
      list-style: none;
      display: grid
    }

    .resume-certs li {
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 4px 12px;
      padding-block: 9px;
      font-weight: 600;
      display: flex
    }

    .issuer {
      font-family: var(--font-mono);
      color: var(--dim);
      font-size: 10.5px;
      font-weight: 500
    }

      align-content: start;
      gap: 16px;
      min-width: 0;
      display: grid

      flex-wrap: wrap;
      align-items: baseline;
      gap: 4px 14px;
      display: flex
    }

    .waffle-head .figure {
      --tone: var(--c-blue)
    }

    .waffle {
      grid-template-columns: repeat(18, minmax(0, 1fr));
      gap: 4px;
      display: grid
    }

    .cell {
      aspect-ratio: 1;
      background: var(--tone);
      border-radius: 4px;
      max-width: 100%;
      transition: opacity .2s, transform .2s
    }

    .waffle.focused .cell:not(.hit) {
      opacity: .15
    }

    .waffle.focused .cell.hit {
      transform: scale(1.08)
    }

    .play .cell {
      animation: .45s cubic-bezier(.2, .9, .3, 1.3) backwards pop;
      animation-delay: calc(var(--i) * 16ms)
    }

    .legend {
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 6px;
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid
    }

    .legend button {
      border: 1px solid var(--line);
      background: var(--surface);
      width: 100%;
      color: var(--ink);
      font: inherit;
      text-align: left;
      cursor: pointer;
      border-radius: 10px;
      grid-template-columns: 12px minmax(0, 1fr) auto;
      align-items: center;
      column-gap: 9px;
      padding: 8px 10px;
      font-size: 13px;
      transition: border-color .2s, background .2s;
      display: grid
    }

    .legend button:hover,
    .legend button:focus-visible {
      border-color: var(--tone);
      background: color-mix(in srgb, var(--tone) 9%, var(--surface))
    }

    .legend i {
      background: var(--tone);
      border-radius: 3px;
      width: 12px;
      height: 12px
    }

    .legend-name {
      font-weight: 600
    }

    .legend-count {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 12px
    }

    .legend-sub {
      color: var(--dim);
      grid-column: 2/-1;
      font-size: 11.5px
    }

    .text-link {
      width: fit-content;
      color: var(--c-blue);
      text-underline-offset: 3px;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      text-decoration: underline;
      display: inline-flex
    }

    .avail {
      gap: 28px 48px;
      display: grid
    }

    @media (width>=900px) {
      .avail {
        grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr)
      }
    }

    .avail-list {
      gap: 0;
      margin: 0;
      display: grid
    }

    .avail-list>div {
      border-bottom: 1px solid var(--line);
      padding-block: 12px
    }

    .avail-list>div:first-child {
      padding-top: 0
    }

    .avail-list dd {
      margin: 4px 0 0;
      font-weight: 600
    }

    .clocks {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-content: start;
      gap: 12px;
      display: grid
    }

    @media (width<=640px) {
      .clocks {
        grid-template-columns: minmax(0, 1fr)
      }
    }

    .clock {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 14px;
      gap: 6px;
      min-width: 0;
      padding: 14px;
      display: grid
    }

    .clock p {
      margin: 0
    }

    .clock-time {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      color: var(--tone);
      font-size: clamp(1.25rem, 1rem + .8vw, 1.6rem);
      font-weight: 600
    }

    .daybar {
      background: var(--surface-2);
      border-radius: 99px;
      height: 6px;
      margin-top: 4px;
      position: relative;
      overflow: hidden
    }

    .daybar i {
      background: var(--tone);
      border-radius: 99px;
      transition: width .9s linear;
      position: absolute;
      inset: 0 auto 0 0
    }

    .rule-top {
      padding-block: clamp(28px, 5vw, 56px) clamp(36px, 5vw, 60px)
    }

    .rule-banner {
      background: var(--ink);
      color: var(--bg);
      border-radius: 22px;
      gap: 14px;
      padding: clamp(22px, 4vw, 40px);
      display: grid
    }

    .rule-banner .eyebrow {
      color: var(--bg);
      opacity: .7
    }

    .rule-title {
      max-width: 18ch;
      font-size: clamp(2rem, 1.2rem + 3.4vw, 3.6rem)
    }

    .rule-lede {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600
    }

    .rule-verified {
      opacity: .8;
      max-width: 70ch;
      margin: 0;
      font-size: 13.5px
    }

    .rule-banner code {
      background: color-mix(in srgb, var(--bg) 16%, transparent);
      color: var(--bg)
    }

    .wording {
      border-top: 1px solid var(--line);
      display: grid
    }

    .wording-row {
      border-bottom: 1px solid var(--line);
      gap: 6px 24px;
      padding-block: 14px;
      display: grid
    }

    @media (width>=900px) {
      .wording-row {
        grid-template-columns: 150px minmax(0, 1.1fr) minmax(0, 1fr);
        align-items: baseline
      }
    }

    .wording-phrase {
      font-size: 15.5px;
      font-weight: 650
    }

    .wording-note {
      color: var(--dim);
      font-size: 13px
    }

    .wording-note .role-tag {
      margin-right: 6px
    }

    .dont {
      border: 1px dashed color-mix(in srgb, var(--bad) 55%, var(--line));
      border-radius: 14px;
      margin-top: 28px;
      padding: 18px
    }

    .dont ul,
    .banned {
      flex-wrap: wrap;
      gap: 8px 10px;
      margin: 12px 0;
      padding: 0;
      list-style: none;
      display: flex
    }

    .dont p {
      margin: 0
    }

    .struck {
      background: color-mix(in srgb, var(--bad) 8%, var(--surface));
      color: var(--dim);
      border-radius: 7px;
      padding: 4px 10px;
      font-size: 13.5px;
      display: inline-block;
      position: relative
    }

    .struck:after {
      content: "";
      background: var(--bad);
      transform-origin: 0;
      border-radius: 2px;
      height: 2px;
      position: absolute;
      top: 52%;
      left: 6px;
      right: 6px
    }

    .play .struck:after {
      animation: grow .45s var(--ease-out) backwards;
      animation-delay: calc(.3s + var(--i) * .11s)
    }

    .variants {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      display: grid
    }

    @media (width<=920px) {
      .variants {
        grid-template-columns: minmax(0, 1fr)
      }
    }

    .variant {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 16px;
      align-content: start;
      gap: 8px;
      min-width: 0;
      padding: 18px;
      display: grid
    }

    .variant p {
      margin: 0
    }

    .variant .eyebrow {
      margin-top: 6px
    }

    .variant-top {
      align-items: center;
      gap: 14px;
      display: flex
    }

    .variant-key {
      background: var(--tone);
      width: 46px;
      height: 46px;
      color: var(--on-tone);
      font-family: var(--font-display);
      border-radius: 12px;
      flex: none;
      place-items: center;
      font-size: 1.5rem;
      font-weight: 800;
      font-stretch: 125%;
      display: grid
    }

    .kw {
      flex-wrap: wrap;
      gap: 5px;
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex
    }

    .kw li {
      border: 1px solid color-mix(in srgb, var(--tone) 45%, var(--line));
      background: color-mix(in srgb, var(--tone) 8%, var(--surface));
      font-family: var(--font-mono);
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 11px
    }

    .panels {
      columns: 2 340px;
      column-gap: 16px
    }

    .panel {
      break-inside: avoid;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 14px;
      gap: 10px;
      margin-bottom: 16px;
      padding: 18px;
      display: grid
    }

    .panel p {
      margin: 0
    }

    .rules {
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid
    }

    .rules li {
      padding-left: 18px;
      position: relative
    }

    .rules li:before {
      content: "";
      border: 2px solid var(--c-blue);
      border-radius: 50%;
      width: 8px;
      height: 8px;
      position: absolute;
      top: .55em;
      left: 0
    }

    .banned {
      margin: 0
    }

    .limits {
      gap: 12px;
      display: grid
    }

    .limit {
      grid-template-columns: 120px minmax(0, 1fr);
      align-items: center;
      gap: 4px 12px;
      font-size: 13.5px;
      display: grid
    }

    .limit-bar {
      background: var(--surface-2);
      border-radius: 4px;
      height: 12px
    }

    .limit-bar i {
      width: var(--w);
      background: var(--tone);
      transform-origin: 0;
      border-radius: 4px;
      height: 100%;
      display: block
    }

    .play .limit-bar i {
      animation: grow .9s var(--ease-out) backwards
    }

    .limit-n {
      font-family: var(--font-mono);
      color: var(--dim);
      grid-column: 2;
      font-size: 10.5px
    }

    .ats {
      flex-wrap: wrap;
      gap: 6px;
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex
    }

    .ats li {
      background: var(--surface-2);
      border-radius: 6px;
      padding: 3px 9px;
      font-size: 12.5px;
      font-weight: 600
    }

    .open-items {
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid
    }

    .open-items li {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 14px;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 12px;
      padding: 16px;
      display: grid
    }

    .open-items p {
      margin: 0
    }

    .open-n {
      background: var(--surface-2);
      width: 34px;
      height: 34px;
      font-family: var(--font-mono);
      border-radius: 9px;
      place-items: center;
      font-weight: 600;
      display: grid
    }

    .open-topic {
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 10px;
      font-weight: 700;
      display: flex;
      margin-bottom: 4px !important
    }

    .pending {
      background: color-mix(in srgb, var(--c-amber) 16%, var(--surface));
      font-family: var(--font-mono);
      border-radius: 999px;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      font-size: 10px;
      font-weight: 500;
      display: inline-flex
    }

    .pending:before {
      content: "";
      background: var(--c-amber);
      border-radius: 50%;
      width: 6px;
      height: 6px;
      animation: 1.6s ease-in-out infinite glow
    }

    .footer {
      border-top: 1px solid var(--line)
    }

    .footer-inner {
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 6px 24px;
      padding-block: 26px 34px;
      font-size: 13px;
      display: flex
    }

    .footer p {
      margin: 0
    }

    @keyframes grow {
      0% {
        transform: scaleX(0)
      }

      to {
        transform: scaleX(1)
      }
    }

    @keyframes pop {
      0% {
        transform: translateY(6px)scale(.7)
      }

      to {
        transform: none
      }
    }

    @keyframes cut {
      0% {
        background: var(--tone);
        opacity: 1;
        border-style: solid
      }

      to {
        opacity: .6;
        background: 0 0;
        border-style: dashed
      }
    }

    @keyframes sweep {

      0%,
      40%,
      to {
        background: var(--surface-2);
        color: var(--ink)
      }

      10%,
      28% {
        background: var(--tone);
        color: var(--on-tone)
      }
    }

    @keyframes flowX {
      0% {
        transform: translate(-8%)
      }

      to {
        transform: translate(100%)
      }
    }

    @keyframes roamX {
      0% {
        left: 6px
      }

      to {
        left: calc(100% - 14px)
      }
    }

    @keyframes roamY {
      0% {
        top: 22px
      }

      to {
        top: calc(100% - 14px)
      }
    }

    @keyframes dash {
      to {
        stroke-dashoffset: -18px
      }
    }

    @keyframes glow {

      0%,
      to {
        opacity: .5
      }

      50% {
        opacity: 1
      }
    }

    @keyframes ping {
      0% {
        opacity: .7;
        transform: scale(1)
      }

      to {
        opacity: 0;
        transform: scale(2.8)
      }
    }

    @keyframes arc {
      0% {
        stroke-dasharray: 0 400
      }
    }

  <style>
    .ag-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px
    }

    @media (width<=960px) {
      .ag-grid {
        grid-template-columns: minmax(0, 1fr)
      }
    }

    .ag-panel {
      container-type: inline-size;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 16px;
      padding: 18px;
      display: grid;
      gap: 12px;
      align-content: start;
      min-width: 0
    }

    .ag-panel.full {
      grid-column: 1/-1
    }

    .ag-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px
    }

    .ag-top .h3 {
      margin-top: 4px
    }

    .ag-note {
      color: var(--dim);
      font-size: 13px;
      margin: 0
    }

    .ag-split {
      display: grid;
      grid-template-columns: minmax(0, 250px) minmax(0, 1fr);
      gap: 16px;
      align-items: center
    }

    @container (width<=520px) {
      .ag-split {
        grid-template-columns: minmax(0, 1fr)
      }

      .ag-split>svg {
        max-width: 280px;
        margin-inline: auto
      }
    }

    .ag-svg {
      width: 100%;
      height: auto;
      display: block;
      overflow: visible
    }

    .ag-goal {
      margin: 0;
      font-size: 14px;
      font-weight: 650;
      line-height: 1.35;
      min-height: 2.7em
    }

    .ag-goal small {
      display: block;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      color: var(--dim);
      letter-spacing: .04em;
      text-transform: uppercase;
      margin-bottom: 3px
    }

    .ag-log {
      list-style: none;
      margin: 0;
      padding: 10px 12px;
      background: var(--surface-2);
      border-radius: 10px;
      font-family: var(--font-mono);
      font-size: 10.5px;
      line-height: 1.45;
      display: grid;
      gap: 3px;
      align-content: end;
      min-height: calc(6 * 1.45em + 6 * 3px + 20px);
      overflow: hidden
    }

    .ag-log li {
      display: grid;
      grid-template-columns: 62px minmax(0, 1fr);
      gap: 8px;
      overflow-wrap: anywhere;
      animation: agIn .35s var(--ease-out) backwards
    }

    .ag-log.wide li {
      grid-template-columns: 150px minmax(0, 1fr)
    }

    @container (width<=520px) {
      .ag-log.wide li {
        grid-template-columns: minmax(0, 1fr);
        gap: 0
      }
    }

    .ag-log li.sep {
      display: block;
      color: var(--dim);
      opacity: .7
    }

    .ag-k {
      font-weight: 600
    }

    .ag-log code {
      background: none;
      padding: 0;
      font-size: 1em;
      color: var(--ink)
    }

    .ag-node-ring {
      fill: var(--surface);
      stroke: var(--line);
      stroke-width: 1.5
    }

    .ag-node {
      transition: transform .3s var(--ease-out)
    }

    .ag-node circle.fill {
      fill: color-mix(in srgb, var(--tone) 10%, var(--surface));
      stroke: var(--tone);
      stroke-width: 1.5;
      transition: fill .25s
    }

    .ag-node.on circle.fill {
      fill: var(--tone)
    }

    .ag-node.on text {
      fill: var(--on-tone)
    }

    .ag-node text {
      fill: var(--ink);
      font: 650 12.5px var(--font-body);
      transition: fill .25s
    }

    .ag-node text.sub {
      font: 500 8.5px var(--font-mono);
      fill: var(--dim)
    }

    .ag-node.on text.sub {
      fill: var(--on-tone);
      opacity: .8
    }

    .ag-track {
      fill: none;
      stroke: var(--line);
      stroke-width: 2;
      stroke-dasharray: 3 6
    }

    .ag-center-a {
      fill: var(--ink);
      font: 800 22px var(--font-display);
      font-stretch: 112%
    }

    .ag-center-b {
      fill: var(--dim);
      font: 500 9.5px var(--font-mono)
    }

    .ag-pulse {
      fill: none;
      stroke: var(--tone);
      stroke-width: 2;
      opacity: 0
    }

    .ag-pulse.go {
      animation: agPing 1s ease-out
    }

    .ag-bus {
      fill: var(--ink)
    }

    .ag-bus-l {
      fill: var(--bg);
      font: 700 13px var(--font-display)
    }

    .ag-bus-s {
      fill: var(--bg);
      opacity: .7;
      font: 500 8.5px var(--font-mono)
    }

    .ag-wire {
      stroke: var(--line);
      stroke-width: 2;
      stroke-dasharray: 3 5
    }

    .ag-agent circle.fill {
      fill: color-mix(in srgb, var(--tone) 12%, var(--surface));
      stroke: var(--tone);
      stroke-width: 1.8
    }

    .ag-agent.busy circle.fill {
      fill: color-mix(in srgb, var(--tone) 32%, var(--surface))
    }

    .ag-agent .ring {
      fill: none;
      stroke: var(--tone);
      stroke-width: 1.5;
      opacity: 0
    }

    .ag-agent.busy .ring {
      animation: agRing 1.1s ease-out infinite
    }

    .ag-agent .nm {
      fill: var(--ink);
      font: 650 12.5px var(--font-body)
    }

    .ag-agent .st {
      fill: var(--dim);
      font: 500 9px var(--font-mono)
    }

    .ag-agent .ic {
      fill: var(--tone);
      font: 700 15px var(--font-display)
    }

    .ag-chain-node rect.fill {
      fill: color-mix(in srgb, var(--tone) 9%, var(--surface));
      stroke: var(--tone);
      stroke-width: 1.5;
      transition: fill .25s, stroke .25s
    }

    .ag-chain-node.down rect.fill {
      stroke: var(--bad);
      stroke-dasharray: 4 4;
      fill: color-mix(in srgb, var(--bad) 7%, var(--surface))
    }

    .ag-chain-node.win rect.fill {
      fill: var(--tone)
    }

    .ag-chain-node.win text {
      fill: var(--on-tone)
    }

    .ag-chain-node .nm {
      fill: var(--ink);
      font: 650 13.5px var(--font-body);
      transition: fill .25s
    }

    .ag-chain-node .tr {
      fill: var(--dim);
      font: 500 9px var(--font-mono);
      transition: fill .25s
    }

    .ag-chain-node .st {
      font: 600 9px var(--font-mono);
      transition: fill .25s
    }

    .ag-chain-node.shake {
      animation: agShake .32s ease-in-out
    }

    .ag-link {
      stroke: var(--line);
      stroke-width: 2
    }

    .ag-tok {
      fill: var(--ink)
    }

    .ag-tok.back {
      fill: var(--ok)
    }

    .ag-counters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px
    }

    .ag-counters span {
      font-family: var(--font-mono);
      font-size: 11px;
      background: var(--surface-2);
      border-radius: 999px;
      padding: 3px 10px
    }

    .ag-counters b {
      font-weight: 600
    }

    .ag-status {
      margin: 0;
      min-height: 2.6em;
      color: var(--dim);
      font-size: 13.5px
    }

    .ag-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 14px;
      margin: 0;
      padding: 0;
      list-style: none;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--dim)
    }

    .ag-legend li {
      display: inline-flex;
      align-items: center;
      gap: 6px
    }

    .ag-legend i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--c)
    }

    @keyframes agIn {
      from {
        opacity: 0;
        transform: translateY(4px)
      }
    }

    @keyframes agPing {
      0% {
        opacity: .8;
        r: 30
      }

      100% {
        opacity: 0;
        r: 48
      }
    }

    @keyframes agRing {
      0% {
        opacity: .7;
        r: 27
      }

      100% {
        opacity: 0;
        r: 40
      }
    }

    @keyframes agShake {

      0%,
      100% {
        transform: translateX(0)
      }

      25% {
        transform: translateX(-4px)
      }

      75% {
        transform: translateX(4px)
      }
    }

    @media (prefers-reduced-motion:reduce) {
      .ag-log li {
        animation: none
      }
    }
  </style>
  <script>

      animation-duration: 38s;

      inset: 0;
      width: 100%;
      height: 100%;

    #jg-bg .edge {

      stroke: var(--g-edge);

    }

    #jg-switch {

    #jg-switch button {

      border-radius: 999px;
      padding: 6px 12px;
      color: var(--dim);
      background: transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;

    }

    #jg-switch button i {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--sw)
    }

    #jg-switch button[aria-checked=true] {
      color: var(--ink);
      background: var(--surface-2)
    }

    #jg-switch button:focus-visible {
      outline: 2px solid var(--g-accent);
      outline-offset: 1px
    }

    @media (prefers-reduced-motion:reduce) {

      #jg-bg *,
      :root[data-glass] :is(.tile, .gw-panel, .panel, .variant, .ag-panel)::after {
        animation: none !important
      }

      #jg-bg .pkt {
        display: none
      }
    }

    @media print {

      #jg-bg,
      #jg-switch {
        display: none
      }
    }
  </style>
  <script>
      (function () {

        var E = [[0, 1], [0, 2], [1, 3], [2, 3], [3, 4], [3, 5], [4, 6], [5, 6], [2, 7], [7, 8], [8, 3], [8, 9], [9, 10], [10, 6], [10, 11], [7, 12], [5, 10]];
        var ed = '', fl = '', pk = '', nd = '';
        E.forEach(function (e, i) {

          if (i % 2 === 0) pk += '<circle class="pkt" r="3"><animateMotion dur="' + (3 + (i % 5) * .7) + 's" repeatCount="indefinite" begin="-' + (i * .5) + 's" path="' + d + '"/></circle>'
        });
        N.forEach(function (n, i) { nd += '<rect class="node" x="' + (n[0] - 34) + '" y="' + (n[1] - 18) + '" width="68" height="36" rx="10" style="animation-delay:-' + (i * .6) + 's"/><circle class="core" cx="' + n[0] + '" cy="' + n[1] + '" r="3.5"/>' });
        var bg = document.createElement('div'); bg.id = 'jg-bg'; bg.setAttribute('aria-hidden', 'true');

        document.body.insertBefore(bg, document.body.firstChild);
