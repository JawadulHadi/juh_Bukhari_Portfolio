<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Config Plane Rollback</title>
    <style>
      :root {
        --bg: #f2f4fa;
        --surface: #fff;
        --surface-2: #e8ecf6;
        --ink: #10162a;
        --dim: #535d77;
        --line: #d6dcea;
        --c-blue: #2d5bef;
        --c-teal: #0a9a8c;
        --c-amber: #c47600;
        --c-coral: #e5482e;
        --c-magenta: #cc2f86;
        --c-violet: #6b47ee;
        --c-lime: #4b9a1c;
        --ok: #148a4d;
        --bad: #d7363c;
        --on-tone: #fff;
        --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
        --font-display:
          "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
        --font-body:
          "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
        --font-mono:
          "Martian Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0f1e;
          --surface: #111930;
          --surface-2: #1a2440;
          --ink: #e9edf8;
          --dim: #9aa5c0;
          --line: #26314f;
          --c-blue: #7090ff;
          --c-teal: #2ccdbb;
          --c-amber: #f5b83d;
          --c-coral: #ff7a62;
          --c-magenta: #f168b3;
          --c-violet: #a08bff;
          --c-lime: #8ad15a;
          --ok: #3dd68c;
          --bad: #ff6369;
          --on-tone: #0a0f1e;
        }
      }
      [data-juh="dark"] {
        --bg: #0a0f1e;
        --surface: #111930;
        --surface-2: #1a2440;
        --ink: #e9edf8;
        --dim: #9aa5c0;
        --line: #26314f;
        --c-blue: #7090ff;
        --c-teal: #2ccdbb;
        --c-amber: #f5b83d;
        --c-coral: #ff7a62;
        --c-magenta: #f168b3;
        --c-violet: #a08bff;
        --c-lime: #8ad15a;
        --ok: #3dd68c;
        --bad: #ff6369;
        --on-tone: #0a0f1e;
      }
      [data-juh="light"] {
        --bg: #f2f4fa;
        --surface: #fff;
        --surface-2: #e8ecf6;
        --ink: #10162a;
        --dim: #535d77;
        --line: #d6dcea;
        --c-blue: #2d5bef;
        --c-teal: #0a9a8c;
        --c-amber: #c47600;
        --c-coral: #e5482e;
        --c-magenta: #cc2f86;
        --c-violet: #6b47ee;
        --c-lime: #4b9a1c;
        --ok: #148a4d;
        --bad: #d7363c;
        --on-tone: #fff;
      }
      *,
      :before,
      :after {
        box-sizing: border-box;
        border-style: solid;
        border-width: 0;
        border-color: var(--line);
      }
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-size: inherit;
        font-weight: inherit;
        margin: 0;
      }
      p {
        margin: 0;
      }
      ol,
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        cursor: pointer;
      }
      svg {
        display: block;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-body);
        font-size: 15px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        padding: 24px;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      .ag-panel {
        container-type: inline-size;
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 16px;
        padding: 18px;
        display: grid;
        gap: 12px;
        align-content: start;
        min-width: 0;
        width: min(800px, 100%);
      }
      .ag-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 10px;
      }
      .ag-top .h3 {
        margin-top: 4px;
      }
      .ag-svg {
        width: 100%;
        height: auto;
        display: block;
        overflow: visible;
      }
      .cp-node rect.fill {
        fill: color-mix(in srgb, var(--tone) 9%, var(--surface));
        stroke: var(--tone);
        stroke-width: 1.5;
        transition:
          fill 0.3s,
          stroke 0.3s;
      }
      .cp-node.active rect.fill {
        fill: color-mix(in srgb, var(--tone) 22%, var(--surface));
        stroke: var(--tone);
        stroke-width: 2;
      }
      .cp-node.done rect.fill {
        fill: var(--tone);
      }
      .cp-node.done text {
        fill: var(--on-tone);
      }
      .cp-node .nm {
        fill: var(--ink);
        font: 650 13px var(--font-body);
        transition: fill 0.3s;
      }
      .cp-node .sub {
        fill: var(--dim);
        font: 500 9px var(--font-mono);
        transition: fill 0.3s;
      }
      .cp-node .badge {
        font: 700 9px var(--font-mono);
        transition: fill 0.3s;
      }
      .cp-node.pulse .ring {
        animation: cpRing 1s ease-out infinite;
      }
      .cp-node .ring {
        fill: none;
        stroke: var(--tone);
        stroke-width: 1.5;
        opacity: 0;
      }
      .cp-redis-slot {
        font: 500 9.5px var(--font-mono);
        fill: var(--dim);
        transition: fill 0.35s;
      }
      .cp-redis-slot.changed {
        fill: var(--ok);
      }
      .cp-wire {
        stroke: var(--line);
        stroke-width: 1.5;
        stroke-dasharray: 4 4;
      }
      .cp-arrow {
        fill: none;
        stroke: var(--c-violet);
        stroke-width: 2.5;
        opacity: 0;
        transition: opacity 0.2s;
      }
      .cp-arrow.visible {
        opacity: 1;
      }
      .cp-alert {
        font: 600 8.5px var(--font-mono);
        fill: var(--bad);
        opacity: 0;
        transition: opacity 0.3s;
      }
      .cp-alert.visible {
        opacity: 1;
      }
      .ag-stats {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .ag-stat {
        font-family: var(--font-mono);
        font-size: 11px;
        background: var(--surface-2);
        border-radius: 999px;
        padding: 3px 10px;
      }
      .ag-stat b {
        font-weight: 600;
      }
      .ag-timer {
        font-family: var(--font-display);
        font-size: 32px;
        font-weight: 700;
        color: var(--c-violet);
        font-variant-numeric: tabular-nums;
        line-height: 1;
        transition: color 0.35s;
      }
      .ag-timer.done {
        color: var(--ok);
      }
      .ag-timer-label {
        font-family: var(--font-mono);
        font-size: 10.5px;
        color: var(--dim);
        margin-top: 3px;
      }
      .ag-status {
        margin: 0;
        color: var(--dim);
        font-size: 13px;
        min-height: 1.4em;
      }
      .ag-log {
        list-style: none;
        margin: 0;
        padding: 8px 12px;
        background: var(--surface-2);
        border-radius: 9px;
        font-family: var(--font-mono);
        font-size: 10.5px;
        line-height: 1.45;
        display: grid;
        gap: 3px;
        align-content: end;
        overflow: hidden;
        min-height: 68px;
      }
      .ag-log li {
        display: grid;
        grid-template-columns: 110px minmax(0, 1fr);
        gap: 8px;
        overflow-wrap: anywhere;
        animation: agIn 0.35s var(--ease-out) backwards;
      }
      .ag-log li.sep {
        display: block;
        color: var(--dim);
        opacity: 0.7;
      }
      .ag-k {
        font-weight: 600;
      }
      .ag-note {
        color: var(--dim);
        font-size: 13px;
        margin: 0;
      }
      .eyebrow {
        font-family: var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--dim);
        margin: 0;
        font-size: 10.5px;
        font-weight: 500;
      }
      .h3 {
        font-family: var(--font-display);
        margin: 0;
        font-size: 1.05rem;
        font-weight: 700;
        font-stretch: 100%;
        line-height: 1.25;
      }
      .role-tag {
        background: color-mix(in srgb, var(--role) 13%, transparent);
        color: var(--ink);
        font-family: var(--font-mono);
        white-space: nowrap;
        border-radius: 6px;
        flex: none;
        align-items: center;
        gap: 6px;
        padding: 3px 8px;
        font-size: 10px;
        font-weight: 500;
        display: inline-flex;
      }
      .role-tag:before {
        content: "";
        background: var(--role);
        border-radius: 50%;
        width: 7px;
        height: 7px;
      }
      @keyframes agIn {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
      }
      @keyframes cpRing {
        0% {
          opacity: 0.7;
          r: 32;
        }
        100% {
          opacity: 0;
          r: 46;
        }
      }
    </style>
  </head>
  <body>
    <div class="ag-panel" id="p5"></div>
    <script>
      (() => {
        "use strict";
        const NS = "http://www.w3.org/2000/svg";
        const RM =
          window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

        function s(tag, a, p) {
          const n = document.createElementNS(NS, tag);
          for (const k in a || {}) {
            if (k === "text") n.textContent = a[k];
            else n.setAttribute(k, a[k]);
          }
          if (p) p.appendChild(n);
          return n;
        }
        function h(tag, a, p) {
          const n = document.createElement(tag);
          for (const k in a || {}) {
            if (k === "text") n.textContent = a[k];
            else n.setAttribute(k, a[k]);
          }
          if (p) p.appendChild(n);
          return n;
        }

        const live = new Set();
        let raf = 0,
          last = 0;
        function frame(t) {
          const dt = Math.min(64, last ? t - last : 16);
          last = t;
          for (const c of live) {
            if (!c.root.isConnected) {
              live.delete(c);
              continue;
            }
            if (!document.hidden && c.visible) c.tick(dt);
          }
          if (live.size) raf = requestAnimationFrame(frame);
          else {
            raf = 0;
            last = 0;
          }
        }
        const io =
          "IntersectionObserver" in window
            ? new IntersectionObserver(
                (es) => {
                  for (const e of es) {
                    const c = e.target.__ag;
                    if (c) c.visible = e.isIntersecting;
                  }
                },
                { rootMargin: "80px" },
              )
            : null;
        function run(c) {
          c.visible = !io;
          c.root.__ag = c;
          if (io) io.observe(c.root);
          if (RM) {
            if (c.still) c.still();
            return;
          }
          live.add(c);
          if (!raf) raf = requestAnimationFrame(frame);
        }
        function logger(ul, max) {
          return {
            push(parts, cls) {
              const li = h("li", cls ? { class: cls } : {}, ul);
              for (const p of parts) {
                const n = h(
                  p.code ? "code" : "span",
                  p.cls ? { class: p.cls } : {},
                  li,
                );
                n.textContent = p.t;
                if (p.c) n.style.color = p.c;
              }
              while (ul.children.length > max) ul.removeChild(ul.firstChild);
            },
            clear() {
              ul.textContent = "";
            },
          };
        }

        function mountConfigPlane(panel) {
          const top = h("div", { class: "ag-top" }, panel);
          const d = h("div", {}, top);
          // FIXED: single-quoted string so the inner "Designing…" is legal JS.
          h(
            "p",
            {
              class: "eyebrow",
              text: 'Config plane · Redis pub/sub · from "Designing for AI Failure"',
            },
            d,
          );
          h(
            "h3",
            {
              class: "h3",
              text: "Prompt rollback in < 5 seconds · zero deploys",
            },
            d,
          );
          const tag = h("span", { class: "role-tag", text: "Backend Lead" }, top);
          tag.style.setProperty("--role", "var(--c-blue)");

          // Timer + stats row
          const timerRow = h(
            "div",
            {
              style: "display:flex;align-items:flex-start;gap:24px;flex-wrap:wrap;",
            },
            panel,
          );
          const timerWrap = h("div", {}, timerRow);
          const timerEl = h("div", { class: "ag-timer", text: "0.0s" }, timerWrap);
          h("div", { class: "ag-timer-label", text: "rollback timer" }, timerWrap);

          const statsWrap = h(
            "div",
            {
              class: "ag-stats",
              style: "align-self:center;",
              role: "status",
              "aria-live": "polite",
              "aria-label": "Rollback counters",
            },
            timerRow,
          );

          // Stable stat pills: created once, only the <b> textContent updates.
          function makeStat(label) {
            const el = h("span", { class: "ag-stat" }, statsWrap);
            const b = h("b", { text: "0" }, el);
            el.append(" " + label);
            return b;
          }
          const statB = {
            rollbacks: makeStat("rollbacks"),
            deploys: makeStat("deploys"),
            dropped: makeStat("dropped reqs"),
          };
          function updateStats(rb, dep, dr) {
            statB.rollbacks.textContent = String(rb);
            statB.deploys.textContent = String(dep);
            statB.dropped.textContent = String(dr);
          }
          updateStats(0, 0, 0);

          const holder = h("div", {}, panel);
          const status = h("p", { class: "ag-status", "aria-live": "polite" }, panel);
          status.textContent =
            "Steady state: all gateways serving talent-screening@v3.";

          const ul = h(
            "ol",
            {
              class: "ag-log",
              "aria-live": "polite",
              "aria-label": "Rollback log",
            },
            panel,
          );
          const log = logger(ul, 5);
          h(
            "p",
            {
              class: "ag-note",
              text: "Simulated. Breakers reset before each loop. Rollback = Redis pointer flip; no service restarts.",
            },
            panel,
          );

          // SVG layout
          const W = 560,
            H = 300;
          const SVG_AUTHOR = [280, 52];
          const SVG_REDIS = [280, 165];
          const SVG_GWS = [
            [80, 275],
            [280, 275],
            [480, 275],
          ];
          const GW_LABELS = ["Gateway-1", "Gateway-2", "Gateway-3"];

          let svg,
            elAuthor,
            elRedis,
            elGWs = [],
            elAlert,
            elSlots,
            elArrowWR,
            elArrowsRG,
            elPubDots;

          function buildSvg() {
            holder.textContent = "";
            svg = s(
              "svg",
              {
                class: "ag-svg",
                viewBox: `0 0 ${W} ${H}`,
                role: "img",
                "aria-label":
                  "Config Author writes a pointer to Redis, which pub/sub-notifies three Gateway instances",
              },
              holder,
            );

            // Static wires
            s(
              "line",
              {
                x1: SVG_AUTHOR[0],
                y1: SVG_AUTHOR[1] + 28,
                x2: SVG_REDIS[0],
                y2: SVG_REDIS[1] - 32,
                class: "cp-wire",
              },
              svg,
            );
            SVG_GWS.forEach(([gx, gy]) => {
              s(
                "line",
                {
                  x1: SVG_REDIS[0],
                  y1: SVG_REDIS[1] + 32,
                  x2: gx,
                  y2: gy - 28,
                  class: "cp-wire",
                },
                svg,
              );
            });

            // Author node
            elAuthor = makeNode(
              svg,
              SVG_AUTHOR,
              "Config Author",
              "operator · SLO alert",
              "var(--c-coral)",
              80,
              52,
            );

            // Alert badge on Author
            elAlert = s(
              "text",
              {
                class: "cp-alert",
                x: SVG_AUTHOR[0] + 44,
                y: SVG_AUTHOR[1] - 10,
                "text-anchor": "middle",
                text: "bad output ⚠",
              },
              svg,
            );

            // Redis node (wider)
            elRedis = makeNode(
              svg,
              SVG_REDIS,
              "Redis",
              "config store · pub/sub",
              "var(--c-violet)",
              140,
              60,
            );

            // Redis internal slots
            const slotKeys = [
              "prompt:talent-screening",
              "routing:apac",
              "tenant:acme-override",
            ];
            const slotVals = ["@ v3", "→ stable", "→ on"];
            elSlots = slotKeys.map((k, i) => {
              const sy = SVG_REDIS[1] - 10 + i * 13;
              const g = s("g", {}, svg);
              s(
                "text",
                {
                  class: "cp-redis-slot",
                  x: SVG_REDIS[0] - 62,
                  y: sy,
                  text: k,
                },
                g,
              );
              const v = s(
                "text",
                {
                  class: "cp-redis-slot",
                  x: SVG_REDIS[0] + 65,
                  y: sy,
                  "text-anchor": "end",
                  text: slotVals[i],
                },
                g,
              );
              return v;
            });

            // Gateway nodes
            elGWs = SVG_GWS.map(([gx, gy], i) =>
              makeNode(
                svg,
                [gx, gy],
                GW_LABELS[i],
                "serving v3",
                "var(--c-teal)",
                88,
                50,
              ),
            );

            // Animated arrows
            elArrowWR = makeArrow(svg, SVG_AUTHOR, SVG_REDIS, "var(--c-coral)");
            elArrowsRG = SVG_GWS.map(([gx, gy]) =>
              makeArrow(svg, SVG_REDIS, [gx, gy], "var(--c-violet)"),
            );

            // Pub/sub dots
            elPubDots = SVG_GWS.map(([gx, gy]) => {
              const dot = s(
                "circle",
                {
                  r: 5,
                  style:
                    "fill:var(--c-violet);stroke:var(--surface);stroke-width:1.5;opacity:0",
                },
                svg,
              );
              return dot;
            });
          }

          function makeNode(parent, [cx, cy], label, sub, tone, nw, nh) {
            const g = s("g", { transform: `translate(${cx} ${cy})` }, parent);
            const inner = s("g", { class: "cp-node" }, g);
            inner.style.setProperty("--tone", tone);
            s("circle", { class: "ring", r: 30 }, inner);
            s(
              "rect",
              {
                class: "fill",
                x: -nw / 2,
                y: -nh / 2,
                width: nw,
                height: nh,
                rx: 12,
              },
              inner,
            );
            s(
              "text",
              { class: "nm", "text-anchor": "middle", y: -5, text: label },
              inner,
            );
            const subEl = s(
              "text",
              { class: "sub", "text-anchor": "middle", y: 8, text: sub },
              inner,
            );
            return { inner, subEl };
          }

          function makeArrow(parent, [ax, ay], [bx, by]) {
            const dx = bx - ax,
              dy = by - ay,
              len = Math.sqrt(dx * dx + dy * dy);
            const nx = dx / len,
              ny = dy / len;
            const sx = ax + nx * 30,
              sy = ay + ny * 30;
            const ex = bx - nx * 30,
              ey = by - ny * 30;
            const g = s("g", {}, parent);
            const line = s(
              "line",
              {
                class: "cp-arrow",
                x1: sx,
                y1: sy,
                x2: ex,
                y2: ey,
                "stroke-width": 2,
              },
              g,
            );
            const angle = Math.atan2(ey - sy, ex - sx);
            const ah = 7;
            const p1x = ex - ah * Math.cos(angle - 0.4),
              p1y = ey - ah * Math.sin(angle - 0.4);
            const p2x = ex - ah * Math.cos(angle + 0.4),
              p2y = ey - ah * Math.sin(angle + 0.4);
            const head = s(
              "polyline",
              {
                class: "cp-arrow",
                points: `${p1x},${p1y} ${ex},${ey} ${p2x},${p2y}`,
                "stroke-width": 2,
                "stroke-linecap": "round",
                "stroke-linejoin": "round",
              },
              g,
            );
            return {
              line,
              head,
              show() {
                line.classList.add("visible");
                head.classList.add("visible");
              },
              hide() {
                line.classList.remove("visible");
                head.classList.remove("visible");
              },
            };
          }

          buildSvg();

          // Debounced rebuild on resize. buildSvg() clears the SVG, so we
          // never accumulate nodes; the animation state is preserved by
          // re-applying it in resetScene() only when we're in "steady".
          if (window.ResizeObserver) {
            let pending = 0;
            new ResizeObserver(() => {
              cancelAnimationFrame(pending);
              pending = requestAnimationFrame(() => {
                buildSvg();
                // Re-apply the last committed scene state after rebuild.
                if (st.phase === "steady") resetScene();
                else applySceneState();
              });
            }).observe(holder);
          }

          // Animation state machine
          const st = {
            phase: "steady",
            t: 0,
            rollbacks: 0,
            fanoutIdx: 0,
            elapsed: 0,
            timerActive: false,
          };

          function setPhase(p) {
            st.phase = p;
            st.t = 0;
          }

          // Idempotent "steady" reset — safe to call after a rebuild too.
          function resetScene() {
            elAlert.classList.remove("visible");
            elArrowWR.hide();
            elArrowsRG.forEach((a) => a.hide());
            elPubDots.forEach((d) => (d.style.opacity = 0));
            elAuthor.inner.classList.remove("active", "done", "pulse");
            elRedis.inner.classList.remove("active", "done", "pulse");
            elGWs.forEach((g) => {
              g.inner.classList.remove("active", "done", "pulse");
              g.subEl.textContent = "serving v3";
            });
            elSlots[0].textContent = "@ v3";
            elSlots[0].classList.remove("changed");
            timerEl.textContent = "0.0s";
            timerEl.className = "ag-timer";
            st.elapsed = 0;
            st.timerActive = false;
          }

          // Best-effort re-apply if a resize happens mid-animation.
          // We don't try to perfectly restore the frame — just stop
          // animation cleanly and reset to a coherent visual.
          function applySceneState() {
            // Any mid-flight visual is dropped; the next tick() will
            // continue from the current phase value and re-drive the DOM.
            // Arrows/dots are re-hidden so nothing floats orphaned.
            elArrowWR.hide();
            elArrowsRG.forEach((a) => a.hide());
            elPubDots.forEach((d) => (d.style.opacity = 0));
          }

          resetScene();
          log.push([{ t: "— rollback loop —" }], "sep");

          return {
            root: panel,

            // Frozen but representative state for prefers-reduced-motion.
            // Advances the state machine enough to show the mid-rollback
            // frame (author pulsing, arrow visible, timer at ~1.2s).
            still() {
              // Manually place the DOM in the "write" phase.
              elAlert.classList.add("visible");
              elAuthor.inner.classList.add("active", "pulse");
              elArrowWR.show();
              timerEl.textContent = "1.2s";
              st.timerActive = false;
              st.elapsed = 1200;
              log.clear();
              log.push([{ t: "— rollback loop (frozen) —" }], "sep");
              log.push([
                { t: "slo·monitor", cls: "ag-k", c: "var(--bad)" },
                { t: "output anomaly detected · talent-screening@v3" },
              ]);
              log.push([
                { t: "operator", cls: "ag-k", c: "var(--c-coral)" },
                { t: "redis SET prompt:talent-screening @v2" },
              ]);
              status.textContent =
                "Animation off (reduced motion). The rollback loop: operator writes a Redis pointer (v3→v2); pub/sub notifies all gateway replicas; they reload in <200ms each. Total: ~4.1s, zero deploys.";
            },

            tick(dt) {
              st.t += dt;
              if (st.timerActive) {
                st.elapsed = Math.min(st.elapsed + dt, 4100);
                timerEl.textContent = (st.elapsed / 1000).toFixed(1) + "s";
              }

              if (st.phase === "steady") {
                if (st.t > 1400) {
                  setPhase("alert");
                  elAlert.classList.add("visible");
                  elAuthor.inner.classList.add("active");
                  status.textContent =
                    "Bad output detected. SLO alert fires on Config Author.";
                  log.push([
                    { t: "slo·monitor", cls: "ag-k", c: "var(--bad)" },
                    {
                      t: "output anomaly detected · talent-screening@v3",
                    },
                  ]);
                }
              } else if (st.phase === "alert") {
                if (st.t > 900) {
                  setPhase("write");
                  elArrowWR.show();
                  elAuthor.inner.classList.add("pulse");
                  st.timerActive = true;
                  status.textContent =
                    "Operator flips the Redis pointer: talent-screening@v3 → @v2.";
                  log.push([
                    { t: "operator", cls: "ag-k", c: "var(--c-coral)" },
                    { t: "redis SET prompt:talent-screening @v2" },
                  ]);
                }
              } else if (st.phase === "write") {
                if (st.t > 700) {
                  setPhase("redis_update");
                  elArrowWR.hide();
                  elAlert.classList.remove("visible");
                  elAuthor.inner.classList.remove("active", "pulse");
                  elRedis.inner.classList.add("active", "pulse");
                  elSlots[0].textContent = "@ v2";
                  elSlots[0].classList.add("changed");
                  status.textContent =
                    "Redis updates the pointer. Pub/sub fanout begins.";
                  log.push([
                    { t: "redis", cls: "ag-k", c: "var(--c-violet)" },
                    {
                      t: "pointer updated → pub/sub PUBLISH config:reload",
                    },
                  ]);
                }
              } else if (st.phase === "redis_update") {
                if (st.t > 500) {
                  setPhase("fanout");
                  st.fanoutIdx = 0;
                  elRedis.inner.classList.remove("pulse");
                }
              } else if (st.phase === "fanout") {
                const delay = 220;
                const visible = Math.floor(st.t / delay);
                for (let i = 0; i < 3; i++) {
                  if (i < visible) elArrowsRG[i].show();
                }
                if (st.t > 220 * 3 + 200) {
                  setPhase("gw_reload");
                  st.fanoutIdx = 0;
                  elArrowsRG.forEach((a) => a.hide());
                  status.textContent =
                    "All three gateway replicas receive the pub/sub event.";
                }
              } else if (st.phase === "gw_reload") {
                const delay = 350;
                const done = Math.floor(st.t / delay);
                for (let i = 0; i < 3; i++) {
                  if (i < done) {
                    if (!elGWs[i].inner.classList.contains("done")) {
                      elGWs[i].inner.classList.add("done");
                      elGWs[i].inner.classList.remove("active");
                      elGWs[i].subEl.textContent = "v2 ✓ loaded";
                      if (i === 0) {
                        status.textContent =
                          "Gateway-1 invalidated cache. Serving talent-screening@v2.";
                        log.push([
                          {
                            t: "gateway-1",
                            cls: "ag-k",
                            c: "var(--c-teal)",
                          },
                          {
                            t: "cache invalidated · talent-screening@v2 loaded",
                          },
                        ]);
                      } else if (i === 1) {
                        log.push([
                          {
                            t: "gateway-2",
                            cls: "ag-k",
                            c: "var(--c-teal)",
                          },
                          {
                            t: "cache invalidated · talent-screening@v2 loaded",
                          },
                        ]);
                      } else {
                        log.push([
                          {
                            t: "gateway-3",
                            cls: "ag-k",
                            c: "var(--c-teal)",
                          },
                          {
                            t: "cache invalidated · talent-screening@v2 loaded",
                          },
                        ]);
                      }
                    } else {
                      elGWs[i].inner.classList.add("active");
                    }
                  }
                }
                if (done >= 3 && st.t > delay * 3 + 300) {
                  setPhase("complete");
                  st.timerActive = false;
                  timerEl.className = "ag-timer done";
                  elRedis.inner.classList.add("done");
                  elRedis.inner.classList.remove("active");
                  st.rollbacks++;
                  updateStats(st.rollbacks, 0, 0);
                  status.textContent = `Rollback complete in ${(st.elapsed / 1000).toFixed(1)}s. Zero deploys. Zero dropped requests.`;
                  log.push([
                    { t: "rollback", cls: "ag-k", c: "var(--ok)" },
                    {
                      t: `complete · ${(st.elapsed / 1000).toFixed(1)}s · 0 deploys · 0 dropped requests`,
                    },
                  ]);
                }
              } else if (st.phase === "complete") {
                if (st.t > 2400) {
                  setPhase("reset");
                }
              } else if (st.phase === "reset") {
                resetScene();
                setPhase("steady");
                status.textContent =
                  "Steady state: all gateways serving talent-screening@v3 (next cycle).";
                log.push([{ t: "— loop —" }], "sep");
              }
            },
          };
        }

        run(mountConfigPlane(document.getElementById("p5")));
      })();
    </script>
    <script>
      if (window.self !== window.top) document.body.style.minHeight = "auto";
    </script>
    <script>
      (function () {
        function applyJuh(s) { document.documentElement.setAttribute('data-juh', s); }
        window.addEventListener('message', function (e) {
          if (e.data && e.data.type === 'juh-theme') applyJuh(e.data.scheme);
        });
        try { if (window.parent !== window) window.parent.postMessage({ type: 'juh-theme-ready' }, '*'); } catch (x) {}
      })();
    </script>
  </body>
