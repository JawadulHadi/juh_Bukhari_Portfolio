<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-agent swarm</title>
<style>
:root{--bg:#f2f4fa;--surface:#fff;--surface-2:#e8ecf6;--ink:#10162a;--dim:#535d77;--line:#d6dcea;--grid:#cdd4e6;
--c-blue:#2d5bef;--c-teal:#0a9a8c;--c-amber:#c47600;--c-coral:#e5482e;--c-magenta:#cc2f86;--c-violet:#6b47ee;--c-lime:#4b9a1c;
--ok:#148a4d;--bad:#d7363c;--on-tone:#fff;--ease-out:cubic-bezier(.2,.8,.2,1);
--font-display:"Archivo","Arial Narrow","Helvetica Neue",Arial,sans-serif;
--font-body:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
--font-mono:"Martian Mono",ui-monospace,"Cascadia Mono",Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0a0f1e;--surface:#111930;--surface-2:#1a2440;--ink:#e9edf8;--dim:#9aa5c0;--line:#26314f;--grid:#1c2643;
--c-blue:#7090ff;--c-teal:#2ccdbb;--c-amber:#f5b83d;--c-coral:#ff7a62;--c-magenta:#f168b3;--c-violet:#a08bff;--c-lime:#8ad15a;
--ok:#3dd68c;--bad:#ff6369;--on-tone:#0a0f1e}}
*,:before,:after{box-sizing:border-box;border-style:solid;border-width:0;border-color:var(--line)}
h1,h2,h3,h4,h5,h6{font-size:inherit;font-weight:inherit;margin:0}p{margin:0}ol,ul{list-style:none;margin:0;padding:0}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}svg{display:block}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;padding:24px;display:grid;place-items:center;min-height:100vh}
.ag-panel{container-type:inline-size;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:18px;display:grid;gap:12px;align-content:start;min-width:0;width:min(720px,100%)}
.ag-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ag-top .h3{margin-top:4px}
.ag-svg{width:100%;height:auto;display:block;overflow:visible}
.ag-log{list-style:none;margin:0;padding:10px 12px;background:var(--surface-2);border-radius:10px;font-family:var(--font-mono);font-size:10.5px;line-height:1.45;display:grid;gap:3px;align-content:end;overflow:hidden}
.ag-log li{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px;overflow-wrap:anywhere;animation:agIn .35s var(--ease-out) backwards}
.ag-log li.sep{display:block;color:var(--dim);opacity:.7}
.ag-k{font-weight:600}
.ag-bus{fill:var(--ink)}
.ag-bus-l{fill:var(--bg);font:700 13px var(--font-display)}
.ag-bus-s{fill:var(--bg);opacity:.7;font:500 8.5px var(--font-mono)}
.ag-wire{stroke:var(--line);stroke-width:2;stroke-dasharray:3 5}
.ag-agent circle.fill{fill:color-mix(in srgb,var(--tone) 12%,var(--surface));stroke:var(--tone);stroke-width:1.8}
.ag-agent.busy circle.fill{fill:color-mix(in srgb,var(--tone) 32%,var(--surface))}
.ag-agent .ring{fill:none;stroke:var(--tone);stroke-width:1.5;opacity:0}
.ag-agent.busy .ring{animation:agRing 1.1s ease-out infinite}
.ag-agent .nm{fill:var(--ink);font:650 12.5px var(--font-body)}
.ag-agent .st{fill:var(--dim);font:500 9px var(--font-mono)}
.ag-agent .ic{fill:var(--tone);font:700 15px var(--font-display)}
.ag-legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0;padding:0;list-style:none;font-family:var(--font-mono);font-size:10px;color:var(--dim)}
.ag-legend li{display:inline-flex;align-items:center;gap:6px}
.ag-legend i{width:8px;height:8px;border-radius:50%;background:var(--c)}
@keyframes agIn{from{opacity:0;transform:translateY(4px)}}
@keyframes agRing{0%{opacity:.7;r:27}100%{opacity:0;r:40}}
.eyebrow{font-family:var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:0;font-size:10.5px;font-weight:500}
.h3{font-family:var(--font-display);margin:0;font-size:1.1rem;font-weight:700;font-stretch:100%;line-height:1.25}
.role-tag{background:color-mix(in srgb,var(--role) 13%,transparent);color:var(--ink);font-family:var(--font-mono);white-space:nowrap;border-radius:6px;flex:none;align-items:center;gap:6px;padding:3px 8px;font-size:10px;font-weight:500;display:inline-flex}
.role-tag:before{content:"";background:var(--role);border-radius:50%;width:7px;height:7px}
</style>
</head>
<body>
<div class="ag-panel" id="p2"></div>
<script>
(() => {
  "use strict";
  const NS="http://www.w3.org/2000/svg";
  const RM=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  function s(tag,a,p){const n=document.createElementNS(NS,tag);for(const k in a||{}){if(k==="text")n.textContent=a[k];else n.setAttribute(k,a[k]);}if(p)p.appendChild(n);return n}
  function h(tag,a,p){const n=document.createElement(tag);for(const k in a||{}){if(k==="text")n.textContent=a[k];else n.setAttribute(k,a[k]);}if(p)p.appendChild(n);return n}
  const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  const lerp=(a,b,t)=>a+(b-a)*t;
  const live=new Set();let raf=0,last=0;
  function frame(t){const dt=Math.min(64,last?t-last:16);last=t;for(const c of live){if(!c.root.isConnected){live.delete(c);continue}if(!document.hidden&&c.visible)c.tick(dt)}if(live.size)raf=requestAnimationFrame(frame);else{raf=0;last=0}}
  const io="IntersectionObserver"in window?new IntersectionObserver(es=>{for(const e of es){const c=e.target.__ag;if(c)c.visible=e.isIntersecting}},{rootMargin:"80px"}):null;
  function run(c){c.visible=!io;c.root.__ag=c;if(io)io.observe(c.root);if(RM){c.still&&c.still();return}live.add(c);if(!raf)raf=requestAnimationFrame(frame)}
  function logger(ul,max){return{push(parts,cls){const li=h("li",cls?{class:cls}:{},ul);for(const p of parts){const n=h(p.code?"code":"span",p.cls?{class:p.cls}:{},li);n.textContent=p.t;if(p.c)n.style.color=p.c}while(ul.children.length>max)ul.removeChild(ul.firstChild)},clear(){ul.textContent=""}}}
  function panelHead(panel,eyebrow,title){const top=h("div",{class:"ag-top"},panel);const d=h("div",{},top);h("p",{class:"eyebrow",text:eyebrow},d);h("h3",{class:"h3",text:title},d);const tag=h("span",{class:"role-tag",text:"Backend Lead"},top);tag.style.setProperty("--role","var(--c-blue)");return top}

  const AGENTS=[
    {id:"planner",name:"Planner",ic:"P",tone:"var(--c-violet)",x:62,y:56},
    {id:"retriever",name:"Retriever · RAG",ic:"R",tone:"var(--c-magenta)",x:298,y:56},
    {id:"tool",name:"Tool runner · MCP",ic:"T",tone:"var(--c-blue)",x:298,y:236},
    {id:"critic",name:"Critic",ic:"C",tone:"var(--c-amber)",x:62,y:236}];
  const SCRIPT=[
    ["planner","retriever","task: find context for the request"],
    ["retriever","planner","3 passages, each with its source"],
    ["planner","tool","task: run the query, draft an answer"],
    ["tool","critic","draft v1"],
    ["critic","tool","revise: one claim has no source"],
    ["tool","critic","draft v2 · sources attached"],
    ["critic","planner","approved ✓"]];
  function mountSwarm(panel){
    panelHead(panel,"Multi-agent · illustrative run","Four agents, one message bus");
    const svg=s("svg",{class:"ag-svg",viewBox:"0 0 360 300",role:"img","aria-label":"Planner, Retriever, Tool runner and Critic agents exchanging messages through a BullMQ and Redis bus"},panel);
    const BX=180,BY=146;
    AGENTS.forEach(a=>s("line",{x1:a.x,y1:a.y,x2:BX,y2:BY,class:"ag-wire"},svg));
    s("rect",{x:BX-62,y:BY-30,width:124,height:60,rx:14,class:"ag-bus"},svg);
    s("text",{x:BX,y:BY-4,"text-anchor":"middle",class:"ag-bus-l",text:"Message bus"},svg);
    s("text",{x:BX,y:BY+12,"text-anchor":"middle",class:"ag-bus-s",text:"BullMQ · Redis"},svg);
    const qslots=[0,1,2].map(i=>s("rect",{x:BX-17+i*12,y:BY+18,width:9,height:5,rx:1.5,style:"fill:var(--bg);opacity:.15"},svg));
    const nodes={};
    AGENTS.forEach(a=>{const g=s("g",{class:"ag-agent",transform:`translate(${a.x} ${a.y})`},svg);g.style.setProperty("--tone",a.tone);
      s("circle",{class:"ring",r:27},g);s("circle",{class:"fill",r:26},g);s("text",{class:"ic","text-anchor":"middle",y:5.5,text:a.ic},g);
      const top=a.y<BY;
      const nm=s("text",{class:"nm","text-anchor":"middle",y:top?-40:46,text:a.name},g);
      const stt=s("text",{class:"st","text-anchor":"middle",y:top?-28:58,text:"idle"},g);
      if(top){nm.setAttribute("y",-44);stt.setAttribute("y",-32)}
      nodes[a.id]={a,g,stt}});
    const dot=s("circle",{r:6.5,style:"opacity:0;stroke:var(--surface);stroke-width:2"},svg);
    const ul=h("ol",{class:"ag-log wide"},panel);const log=logger(ul,5);
    const leg=h("ul",{class:"ag-legend"},panel);
    AGENTS.forEach(a=>{const li=h("li",{},leg);const i=h("i",{},li);i.style.setProperty("--c",a.tone);li.appendChild(document.createTextNode(a.name))});
    const st={i:0,t:0,mode:"out",task:1};
    function setStatus(id,txt,busy){const n=nodes[id];n.stt.textContent=txt;n.g.classList.toggle("busy",!!busy)}
    function begin(){const[from,to,msg]=SCRIPT[st.i];
      Object.keys(nodes).forEach(k=>{if(k!==from&&k!==to)setStatus(k,"idle",false)});
      setStatus(from,"sending",false);dot.style.fill=nodes[from].a.tone;dot.style.opacity=1;
      log.push([{t:`${nodes[from].a.name.split(" ")[0].toLowerCase()} → ${nodes[to].a.name.split(" ")[0].toLowerCase()}`,cls:"ag-k",c:nodes[from].a.tone},{t:msg}])}
    begin();
    return{root:panel,still(){},
      tick(dt){st.t+=dt;const[from,to]=SCRIPT[st.i],A=nodes[from].a,B=nodes[to].a;
        if(st.mode==="out"){const k=Math.min(1,st.t/520),e=ease(k);dot.setAttribute("cx",lerp(A.x,BX,e));dot.setAttribute("cy",lerp(A.y,BY,e));
          if(k>=1){st.t=0;st.mode="queued";dot.style.opacity=0;qslots.forEach((q,i)=>q.style.opacity=i===0?.9:.15)}}
        else if(st.mode==="queued"){qslots.forEach((q,i)=>q.style.opacity=i===Math.floor(st.t/90)%3?.9:.15);
          if(st.t>300){st.t=0;st.mode="in";dot.style.opacity=1;qslots.forEach(q=>q.style.opacity=.15);setStatus(from,"waiting",false)}}
        else if(st.mode==="in"){const k=Math.min(1,st.t/520),e=ease(k);dot.setAttribute("cx",lerp(BX,B.x,e));dot.setAttribute("cy",lerp(BY,B.y,e));
          if(k>=1){st.t=0;st.mode="think";dot.style.opacity=0;setStatus(to,"thinking…",true)}}
        else if(st.mode==="think"){if(st.t>850){st.t=0;setStatus(to,"idle",false);st.i++;
            if(st.i>=SCRIPT.length){st.mode="rest";setStatus("planner","task done ✓",false)}else{st.mode="out";begin()}}}
        else if(st.mode==="rest"){if(st.t>1800){st.t=0;st.i=0;st.mode="out";st.task++;log.push([{t:`— task #${st.task} —`}],"sep");begin()}}
      }};
  }
  run(mountSwarm(document.getElementById("p2")));
})();
</script>
  <script>if(window.self!==window.top)document.body.style.minHeight='auto'</script>
</body>
</html>
