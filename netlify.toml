# Clean URLs and Trailing Slash settings are handled by Netlify's UI or framework settings.
# You cannot set them directly in netlify.toml like you can in vercel.json.
# Go to Site configuration > Build & deploy > Post processing in the Netlify UI
# and enable "Pretty URLs" (for clean URLs) or set your framework to handle it.
# For trailing slashes, Netlify normalizes URLs by default. You may need to adjust
# your framework's config (e.g., Docusaurus, Next.js) to match.

[[redirects]]
  from = "/Portfolio.dc*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/Case*Study.dc*"
  to = "/case1"
  status = 301
  force = true

[[redirects]]
  from = "/resume"
  to = "/resume.pdf"
  status = 302
  force = true

# Legacy URLs → clean ones (mirrors vercel.json).
[[redirects]]
  from = "/credentials.html"
  to = "/credentials"
  status = 301
  force = true

[[redirects]]
  from = "/case1.html"
  to = "/case1"
  status = 301
  force = true

[[redirects]]
  from = "/case2.html"
  to = "/case2"
  status = 301
  force = true

[[redirects]]
  from = "/case1-2"
  to = "/case2"
  status = 301
  force = true

[[redirects]]
  from = "/case1-2.html"
  to = "/case2"
  status = 301
  force = true

[[redirects]]
  from = "/case-study-2"
  to = "/case2"
  status = 301
  force = true

# Clean URLs → page files under lib/ (status 200 = rewrite).
[[redirects]]
  from = "/favicon.svg"
  to = "/assets/favicon.svg"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "/lib/public/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/credentials"
  to = "/lib/public/credentials.html"
  status = 200
  force = true

[[redirects]]
  from = "/case1"
  to = "/lib/cases/case1.html"
  status = 200
  force = true

[[redirects]]
  from = "/case2"
  to = "/lib/cases/case2.html"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=(), payment=()"

# Netlify paths don't support regex alternation, so one block per directory.
[[headers]]
  for = "/_ds/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Function timeouts are not configured this way in netlify.toml.
# Netlify's default timeout for synchronous functions is 60 seconds.
# To configure timeouts or memory per function, see the note below.