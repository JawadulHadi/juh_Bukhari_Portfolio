name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Syntax check & smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PORT: 3000
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax check
        shell: bash
        run: |
          set -euo pipefail
          for f in server.js api/*.js theme.js certs.js scripts/prerender.js; do
            node --check "$f"
          done

      - name: Pre-rendered HTML is up to date
        run: node scripts/prerender.js --check

      - name: Start server
        shell: bash
        run: |
          set -euo pipefail
          PORT="$PORT" node server.js > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT

          for _ in $(seq 1 40); do
            curl -fsS "http://localhost:$PORT/" >/dev/null && break
            sleep 0.5
          done

          curl -fsS "http://localhost:$PORT/" >/dev/null || {
            echo "Server failed to start"
            cat server.log || true
            exit 1
          }

      - name: Pages are served
        shell: bash
        run: |
          set -euo pipefail
          for p in / /case-study /credentials /Agent.dc.html /resume.pdf /theme.js /certs.js /JUH-LOGO.svg; do
            code=$(curl -sS -o /tmp/response.out -w '%{http_code}' "http://localhost:$PORT$p")
            echo "$p -> $code"
            [ "$code" = "200" ]
          done

      - name: Security headers present
        shell: bash
        run: |
          set -euo pipefail
          headers=$(curl -fsSLI "http://localhost:$PORT/" | tr '[:upper:]' '[:lower:]')
          echo "$headers"
          echo "$headers" | grep -Eq 'permissions-policy: .*microphone=(self)'
          echo "$headers" | grep -Eq 'x-content-type-options: nosniff'

      - name: Agent returns 503 without an API key
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/agent.out -w '%{http_code}' -X POST "http://localhost:$PORT/api/agent" \
            -H 'Content-Type: application/json' \
            -d '{"messages":[{"role":"user","content":"hi"}]}')
          echo "POST /api/agent -> $code"
          [ "$code" = "503" ]

      - name: Agent health endpoint
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/agent-health.out -w '%{http_code}' "http://localhost:$PORT/api/agent")
          echo "GET /api/agent -> $code"
          [ "$code" = "503" ]

      - name: Server log
        if: always()
        shell: bash
        run: |
          echo "---- server.log ----"
          cat server.log || true
