<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Career trace · spans on a shared month scale</title>
    <style>
      :root {
        --bg: #f2f4fa;
        --surface: #fff;
        --surface-2: #e8ecf6;
        --ink: #10162a;
        --dim: #535d77;
        --line: #d6dcea;
        --blue: #2d5bef;
        --teal: #0a9a8c;
        --amber: #c47600;
        --font-body: "Instrument Sans", system-ui, sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0f1e;
          --surface: #111930;
          --surface-2: #1a2440;
          --ink: #e9edf8;
          --dim: #9aa5c0;
          --line: #26314f;
          --blue: #7090ff;
          --teal: #2ccdbb;
          --amber: #f5b83d;
        }
      }
      [data-juh="dark"] {
        --bg: #0a0f1e;
        --surface: #111930;
        --surface-2: #1a2440;
        --ink: #e9edf8;
        --dim: #9aa5c0;
        --line: #26314f;
        --blue: #7090ff;
        --teal: #2ccdbb;
        --amber: #f5b83d;
      }
      [data-juh="light"] {
        --bg: #f2f4fa;
        --surface: #fff;
        --surface-2: #e8ecf6;
        --ink: #10162a;
        --dim: #535d77;
        --line: #d6dcea;
        --blue: #2d5bef;
        --teal: #0a9a8c;
        --amber: #c47600;
      }
      body {
        margin: 0;
        padding: 24px;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-body);
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      .panel {
        width: min(900px, 100%);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 20px;
        display: grid;
        gap: 14px;
      }
      .eyebrow {
        font-family: var(--font-mono);
        font-size: 10.5px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--dim);
        margin: 0;
      }
      .h3 {
        font-size: 1.1rem;
        margin: 4px 0 0;
        font-weight: 700;
      }
      .trace {
        display: grid;
        gap: 0;
      }
      .row {
        display: grid;
        grid-template-columns: 200px minmax(0, 1fr);
        gap: 14px;
        align-items: center;
        padding-block: 8px;
      }
      .row.head {
        border-bottom: 1px solid var(--line);
        padding-bottom: 10px;
        margin-bottom: 8px;
        min-height: 24px;
      }
      .label {
        font-size: 13.5px;
        line-height: 1.3;
      }
      .label strong {
        font-weight: 650;
        display: block;
      }
      .label .dim {
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--dim);
      }
      .lane {
        position: relative;
        height: 24px;
      }
      .lane .grid {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .lane .grid i {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 1px;
        background: var(--line);
      }
      .axis {
        position: relative;
        height: 16px;
        font-family: var(--font-mono);
        color: var(--dim);
        font-size: 10px;
      }
      .axis span {
        position: absolute;
        top: 0;
        transform: translateX(-50%);
        white-space: nowrap;
        min-width: 28px;
        text-align: center;
      }
      .axis span:first-child {
        transform: none;
      }
      .axis span:last-child {
        transform: translateX(-100%);
      }
      .bar {
        position: absolute;
        top: 2px;
        bottom: 2px;
        border-radius: 5px;
        background: var(--tone);
        transform-origin: 0;
        animation: grow 0.8s ease-out backwards;
      }
      .bar.root {
        background: repeating-linear-gradient(
          90deg,
          var(--amber) 0 33%,
          var(--teal) 33% 56%,
          var(--blue) 56% 100%
        );
        opacity: 0.35;
      }
      .bar .now {
        position: absolute;
        top: 50%;
        right: -5px;
        width: 10px;
        height: 10px;
        margin-top: -5px;
        border-radius: 50%;
        background: var(--tone);
        border: 2px solid var(--surface);
      }
      .bar .now:after {
        content: "";
        position: absolute;
        inset: -2px;
        border-radius: 50%;
        border: 2px solid var(--tone);
        animation: ping 1.8s ease-out infinite;
      }
      @keyframes ping {
        from {
          opacity: 0.7;
          transform: scale(1);
        }
        to {
          opacity: 0;
          transform: scale(2.8);
        }
      }
      @keyframes grow {
        from {
          transform: scaleX(0);
        }
      }
      .note {
        color: var(--dim);
        font-size: 13px;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div>
        <p class="eyebrow">Career trace · 3 roles · shared month scale</p>
        <h3 class="h3">Spans on a shared month scale</h3>
      </div>
      <div
        class="trace"
        id="trace"
        role="img"
        aria-label="Career trace: three roles plotted on one shared month axis from the earliest start to today."
      ></div>
      <p class="note">
        Read it like a request trace: one root span for the whole career, one
        child span per role.
      </p>
    </div>
    <script>
      (() => {
        const ROLES = [
          {
            id: "lead",
            title: "Backend Lead Engineer",
            employer: "MicroAgility",
            start: [2024, 0],
            end: null,
            tone: "var(--blue)",
          },
          {
            id: "bse",
            title: "Backend Software Engineer",
            employer: "MicroAgility",
            start: [2022, 2],
            end: [2024, 0],
            tone: "var(--teal)",
          },
          {
            id: "mi",
            title: "Software Engineer",
            employer: "Market Icon",
            start: [2018, 7],
            end: [2022, 2],
            tone: "var(--amber)",
          },
        ];

        const months = (a, b) => (b[0] - a[0]) * 12 + (b[1] - a[1]);

        // Origin = earliest start across all roles. No hardcoded [2018, 7].
        const ORIGIN = ROLES.reduce(
          (acc, r) =>
            r.start[0] < acc[0] || (r.start[0] === acc[0] && r.start[1] < acc[1])
              ? r.start
              : acc,
          ROLES[0].start,
        );

        const nowMonths = (() => {
          const d = new Date();
          return months(ORIGIN, [d.getFullYear(), d.getMonth()]);
        })();
        // Never allow total to be zero (clock skew, mocked date, etc.).
        const total = Math.max(1, nowMonths);

        const trace = document.getElementById("trace");

        const yearStart = ORIGIN[0];
        const yearEnd = new Date().getFullYear();

        // Position of a given calendar year's gridline. Uses the same
        // formula as the bar placement so ticks align with bars.
        function yearLeft(y) {
          return (((y - yearStart) * 12 - ORIGIN[1]) / total) * 100;
        }

        // Header row: axis
        const head = document.createElement("div");
        head.className = "row head";
        const hl = document.createElement("span");
        hl.className = "eyebrow";
        hl.textContent = "Span";
        const hax = document.createElement("div");
        hax.className = "axis";
        for (let y = yearStart; y <= yearEnd; y++) {
          const sp = document.createElement("span");
          sp.style.left = yearLeft(y) + "%";
          sp.textContent = String(y);
          hax.appendChild(sp);
        }
        head.append(hl, hax);
        trace.appendChild(head);

        // Root span
        const rootRow = document.createElement("div");
        rootRow.className = "row";
        const rl = document.createElement("span");
        rl.className = "label";
        rl.innerHTML = '<strong>Career</strong><span class="dim">8+ years</span>';
        const rlane = document.createElement("div");
        rlane.className = "lane";
        const rgrid = document.createElement("div");
        rgrid.className = "grid";
        for (let y = yearStart; y <= yearEnd; y++) {
          const i = document.createElement("i");
          i.style.left = yearLeft(y) + "%";
          rgrid.appendChild(i);
        }
        rlane.appendChild(rgrid);
        const rbar = document.createElement("span");
        rbar.className = "bar root";
        rbar.style.left = "0";
        rbar.style.width = "100%";
        rlane.appendChild(rbar);
        rootRow.append(rl, rlane);
        trace.appendChild(rootRow);

        // One row per role (reverse order → newest at top under the header)
        const rev = [...ROLES].reverse();
        rev.forEach((r, i) => {
          const s = months(ORIGIN, r.start);
          const e = r.end ? months(ORIGIN, r.end) : nowMonths;
          const w = Math.max(1, e - s); // ≥1 so the bar is never zero-width
          const row = document.createElement("div");
          row.className = "row";
          const lbl = document.createElement("span");
          lbl.className = "label";
          const y = Math.floor(w / 12),
            mo = w % 12;
          const dur =
            [y ? `${y} yr` : "", mo ? `${mo} mo` : ""].filter(Boolean).join(" ") ||
            "1 mo";
          lbl.innerHTML = `<strong>${r.title}</strong><span class="dim">${r.employer} · ${dur}</span>`;
          const lane = document.createElement("div");
          lane.className = "lane";
          const grid = document.createElement("div");
          grid.className = "grid";
          for (let yy = yearStart; yy <= yearEnd; yy++) {
            const gi = document.createElement("i");
            gi.style.left = yearLeft(yy) + "%";
            grid.appendChild(gi);
          }
          lane.appendChild(grid);
          const bar = document.createElement("span");
          bar.className = "bar";
          bar.style.setProperty("--tone", r.tone);
          bar.style.left = (s / total) * 100 + "%";
          bar.style.width = (w / total) * 100 + "%";
          bar.style.animationDelay = (i + 1) * 0.2 + "s";
          if (!r.end) {
            const now = document.createElement("span");
            now.className = "now";
            bar.appendChild(now);
          }
          lane.appendChild(bar);
          row.append(lbl, lane);
          trace.appendChild(row);
        });
      })();
    </script>
    <script>
      if (window.self !== window.top) document.body.style.minHeight = "auto";
    </script>
    <script>
      (function () {
        function applyJuh(s) { document.documentElement.setAttribute('data-juh', s); }
        window.addEventListener('message', function (e) {
          if (e.data && e.data.type === 'juh-theme') applyJuh(e.data.scheme);
        });
        try { if (window.parent !== window) window.parent.postMessage({ type: 'juh-theme-ready' }, '*'); } catch (x) {}
      })();
    </script>
  </body>
</html>
