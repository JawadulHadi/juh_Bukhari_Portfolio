<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Config plane · prompts and routing as data</title>
  <style>
    :root {
      --bg: #f2f4fa;
      --surface: #fff;
      --surface-2: #e8ecf6;
      --ink: #10162a;
      --dim: #535d77;
      --line: #d6dcea;
      --grid: #cdd4e6;
      --c-blue: #2d5bef;
      --c-teal: #0a9a8c;
      --c-amber: #c47600;
      --c-coral: #e5482e;
      --c-magenta: #cc2f86;
      --c-violet: #6b47ee;
      --c-lime: #4b9a1c;
      --ok: #148a4d;
      --bad: #d7363c;
      --on-tone: #fff;
      --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
      --font-display:
        "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
      --font-body:
        "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
      --font-mono:
        "Martian Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0f1e;
        --surface: #111930;
        --surface-2: #1a2440;
        --ink: #e9edf8;
        --dim: #9aa5c0;
        --line: #26314f;
        --grid: #1c2643;
        --c-blue: #7090ff;
        --c-teal: #2ccdbb;
        --c-amber: #f5b83d;
        --c-coral: #ff7a62;
        --c-magenta: #f168b3;
        --c-violet: #a08bff;
        --c-lime: #8ad15a;
        --ok: #3dd68c;
        --bad: #ff6369;
        --on-tone: #0a0f1e;
      }
    }

    [data-juh="dark"] {
      --bg: #0a0f1e;
      --surface: #111930;
      --surface-2: #1a2440;
      --ink: #e9edf8;
      --dim: #9aa5c0;
      --line: #26314f;
      --grid: #1c2643;
      --c-blue: #7090ff;
      --c-teal: #2ccdbb;
      --c-amber: #f5b83d;
      --c-coral: #ff7a62;
      --c-magenta: #f168b3;
      --c-violet: #a08bff;
      --c-lime: #8ad15a;
      --ok: #3dd68c;
      --bad: #ff6369;
      --on-tone: #0a0f1e;
    }

    [data-juh="light"] {
      --bg: #f2f4fa;
      --surface: #fff;
      --surface-2: #e8ecf6;
      --ink: #10162a;
      --dim: #535d77;
      --line: #d6dcea;
      --grid: #cdd4e6;
      --c-blue: #2d5bef;
      --c-teal: #0a9a8c;
      --c-amber: #c47600;
      --c-coral: #e5482e;
      --c-magenta: #cc2f86;
      --c-violet: #6b47ee;
      --c-lime: #4b9a1c;
      --ok: #148a4d;
      --bad: #d7363c;
      --on-tone: #fff;
    }

    *,
    :before,
    :after {
      box-sizing: border-box;
      border-style: solid;
      border-width: 0;
      border-color: var(--line);
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-size: inherit;
      font-weight: inherit;
      margin: 0;
    }

    p {
      margin: 0;
    }

    ol,
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      cursor: pointer;
    }

    svg {
      display: block;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      padding: 24px;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }

    .ag-panel {
      container-type: inline-size;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 16px;
      padding: 18px;
      display: grid;
      gap: 12px;
      align-content: start;
      min-width: 0;
      width: min(1000px, 100%);
    }

    .ag-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .ag-top .h3 {
      margin-top: 4px;
    }

    .gw-phases {
      gap: 4px;
      margin: 4px 0 0;
      padding: 0;
      list-style: none;
      display: flex;
    }

    .gw-phases li {
      background: var(--surface-2);
      border-radius: 3px;
      width: 16px;
      height: 5px;
      transition: background 0.3s;
    }

    .gw-phases li.on {
      background: var(--ink);
    }

    .ag-svg {
      width: 100%;
      height: auto;
      display: block;
      overflow: visible;
    }

    .ag-chain-node rect.fill {
      fill: color-mix(in srgb, var(--tone) 9%, var(--surface));
      stroke: var(--tone);
      stroke-width: 1.5;
      transition:
        fill 0.25s,
        stroke 0.25s;
    }

    .ag-chain-node.down rect.fill {
      stroke: var(--bad);
      stroke-dasharray: 4 4;
      fill: color-mix(in srgb, var(--bad) 7%, var(--surface));
    }

    .ag-chain-node.win rect.fill {
      fill: var(--tone);
    }

    .ag-chain-node.win text {
      fill: var(--on-tone);
    }

    .ag-chain-node .nm {
      fill: var(--ink);
      font: 650 13.5px var(--font-body);
      transition: fill 0.25s;
    }

    .ag-chain-node .tr {
      fill: var(--dim);
      font: 500 9px var(--font-mono);
      transition: fill 0.25s;
    }

    .ag-chain-node .st {
      font: 600 9px var(--font-mono);
      transition: fill 0.25s;
    }

    .ag-chain-node.shake {
      animation: agShake 0.32s ease-in-out;
    }

    .ag-link {
      stroke: var(--line);
      stroke-width: 2;
    }

    .ag-tok {
      fill: var(--ink);
    }

    .ag-tok.back {
      fill: var(--ok);
    }

    .ag-counters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .ag-counters span {
      font-family: var(--font-mono);
      font-size: 11px;
      background: var(--surface-2);
      border-radius: 999px;
      padding: 3px 10px;
    }

    .ag-counters b {
      font-weight: 600;
    }

    .ag-status {
      margin: 0;
      min-height: 2.6em;
      color: var(--dim);
      font-size: 13.5px;
    }

    .ag-log {
      list-style: none;
      margin: 0;
      padding: 10px 12px;
      background: var(--surface-2);
      border-radius: 10px;
      font-family: var(--font-mono);
      font-size: 10.5px;
      line-height: 1.45;
      display: grid;
      gap: 3px;
      align-content: end;
      overflow: hidden;
    }

    .ag-log li {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr);
      gap: 8px;
      overflow-wrap: anywhere;
      animation: agIn 0.35s var(--ease-out) backwards;
    }

    .ag-log li.sep {
      display: block;
      color: var(--dim);
      opacity: 0.7;
    }

    .ag-k {
      font-weight: 600;
    }

    .ag-note {
      color: var(--dim);
      font-size: 13px;
      margin: 0;
    }

    @keyframes agIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
    }

    @keyframes agShake {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-4px);
      }

      75% {
        transform: translateX(4px);
      }
    }

    .eyebrow {
      font-family: var(--font-mono);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--dim);
      margin: 0;
      font-size: 10.5px;
      font-weight: 500;
    }

    .h3 {
      font-family: var(--font-display);
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
      font-stretch: 100%;
      line-height: 1.25;
    }

    .role-tag {
      background: color-mix(in srgb, var(--role) 13%, transparent);
      color: var(--ink);
      font-family: var(--font-mono);
      white-space: nowrap;
      border-radius: 6px;
      flex: none;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      font-size: 10px;
      font-weight: 500;
      display: inline-flex;
    }

    .role-tag:before {
      content: "";
      background: var(--role);
      border-radius: 50%;
      width: 7px;
      height: 7px;
    }

    .cfg-box {
      fill: color-mix(in srgb, var(--c-violet) 7%, var(--surface));
      stroke: var(--c-violet);
      stroke-width: 1.5;
    }

    .cfg-ttl {
      fill: var(--c-violet);
      font: 700 9.5px var(--font-mono);
      letter-spacing: 0.08em;
    }

    .cfg-lbl {
      fill: var(--dim);
      font: 600 8.5px var(--font-mono);
      letter-spacing: 0.07em;
    }

    .cfg-val {
      fill: var(--ink);
      font: 600 11.5px var(--font-mono);
    }

    .cfg-row {
      fill: var(--surface-2);
      transition: fill 0.35s;
    }

    .cfg-row.hot {
      fill: color-mix(in srgb, var(--c-violet) 24%, var(--surface));
    }

    .ag-link {
      transition: stroke 0.25s;
    }

    .ag-link.on {
      stroke: var(--c-violet);
    }

    .ag-tok.cfg {
      fill: var(--c-violet);
    }

    .ag-tok.op {
      fill: var(--c-amber);
    }

    .ag-chain-node.down rect.fill {
      stroke-width: 1.5;
    }
  </style>

    <style>
      /* Embedded (iframe) mode: transparent canvas so the page's glass backdrop
         shows through, a translucent panel to match the Credentials page, and no
         inner scrollbars (the parent sizes the frame from the height we report). */
      :root { color-scheme: light; --emb-panel: rgba(255, 255, 255, 0.5); --emb-line: rgba(18, 32, 51, 0.14); }
      @media (prefers-color-scheme: dark) {
        :root { color-scheme: dark; --emb-panel: rgba(8, 12, 24, 0.62); --emb-line: rgba(255, 255, 255, 0.13); }
      }
      [data-juh="dark"] { color-scheme: dark; --emb-panel: rgba(8, 12, 24, 0.62); --emb-line: rgba(255, 255, 255, 0.13); }
      [data-juh="light"] { color-scheme: light; --emb-panel: rgba(255, 255, 255, 0.5); --emb-line: rgba(18, 32, 51, 0.14); }
      html.embedded, html.embedded body { background: transparent; overflow: hidden; }
      html.embedded body { padding: 1px; min-height: 0; }
      html.embedded .ag-panel, html.embedded .panel, html.embedded .wrap, html.embedded .waffle-wrap {
        background: var(--emb-panel);
        border-color: var(--emb-line);
      }
    </style>
  </head>

<body>
  <div class="ag-panel" id="p5"></div>
  <script>
    (() => {
      "use strict";
      const NS = "http://www.w3.org/2000/svg";
      const RM =
        window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

      function s(tag, a, p) {
        const n = document.createElementNS(NS, tag);
        for (const k in a || {}) {
          if (k === "text") n.textContent = a[k];
          else n.setAttribute(k, a[k]);
        }
        if (p) p.appendChild(n);
        return n;
      }
      function h(tag, a, p) {
        const n = document.createElement(tag);
        for (const k in a || {}) {
          if (k === "text") n.textContent = a[k];
          else n.setAttribute(k, a[k]);
        }
        if (p) p.appendChild(n);
        return n;
      }
      const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
      const lerp = (a, b, t) => a + (b - a) * t;

      const live = new Set();
      let raf = 0,
        last = 0;
      function frame(t) {
        const dt = Math.min(64, last ? t - last : 16);
        last = t;
        for (const c of live) {
          if (!c.root.isConnected) {
            live.delete(c);
            continue;
          }
          if (!document.hidden && c.visible) c.tick(dt);
        }
        if (live.size) raf = requestAnimationFrame(frame);
        else {
          raf = 0;
          last = 0;
        }
      }
      const io =
        "IntersectionObserver" in window
          ? new IntersectionObserver(
            (es) => {
              for (const e of es) {
                const c = e.target.__ag;
                if (c) c.visible = e.isIntersecting;
              }
            },
            { rootMargin: "80px" },
          )
          : null;
      function run(c) {
        c.visible = !io;
        c.root.__ag = c;
        if (io) io.observe(c.root);
        if (RM) {
          if (c.still) c.still();
          return;
        }
        live.add(c);
        if (!raf) raf = requestAnimationFrame(frame);
      }
      function logger(ul, max) {
        return {
          push(parts, cls) {
            const li = h("li", cls ? { class: cls } : {}, ul);
            for (const p of parts) {
              const n = h(
                p.code ? "code" : "span",
                p.cls ? { class: p.cls } : {},
                li,
              );
              n.textContent = p.t;
              if (p.c) n.style.color = p.c;
            }
            while (ul.children.length > max) ul.removeChild(ul.firstChild);
          },
          clear() {
            ul.textContent = "";
          },
        };
      }
      function panelHead(panel, eyebrow, title) {
        const top = h("div", { class: "ag-top" }, panel);
        const d = h("div", {}, top);
        h("p", { class: "eyebrow", text: eyebrow }, d);
        h("h3", { class: "h3", text: title }, d);
        const tag = h("span", { class: "role-tag", text: "Backend Lead" }, top);
        tag.style.setProperty("--role", "var(--c-blue)");
        return top;
      }

      const REPS = ["A", "B", "C"];
      const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
      function along(pts, k) {
        const seg = [];
        let total = 0;
        for (let i = 0; i < pts.length - 1; i++) {
          const d = Math.hypot(
            pts[i + 1][0] - pts[i][0],
            pts[i + 1][1] - pts[i][1],
          );
          seg.push(d);
          total += d;
        }
        let dist = clamp(k, 0, 1) * total;
        for (let i = 0; i < seg.length; i++) {
          if (dist <= seg[i] || i === seg.length - 1) {
            const r = seg[i] ? Math.min(1, dist / seg[i]) : 1;
            return [
              lerp(pts[i][0], pts[i + 1][0], r),
              lerp(pts[i][1], pts[i + 1][1], r),
            ];
          }
          dist -= seg[i];
        }
        return pts[pts.length - 1];
      }

      const SC = [
        {
          name: "Prompt rollback",
          init: { pv: "v3", rev: "r7", prov: "gemini", ov: false },
        },
        {
          name: "Routing policy change",
          init: { pv: "v2", rev: "r7", prov: "gemini", ov: false },
        },
        {
          name: "Tenant override",
          init: { pv: "v2", rev: "r8", prov: "anthropic", ov: false },
        },
      ];
      const K_GW = { cls: "ag-k", c: "var(--c-teal)" };
      const K_OP = { cls: "ag-k", c: "var(--c-amber)" };
      const K_RD = { cls: "ag-k", c: "var(--c-violet)" };
      const K_BAD = { cls: "ag-k", c: "var(--bad)" };
      const K_OK = { cls: "ag-k", c: "var(--ok)" };
      const key = (k, t) => ({ t, cls: k.cls, c: k.c });

      function mountConfig(panel) {
        const top = panelHead(
          panel,
          'Config plane · from "Designing for AI Failure, Part 2"',
          "Prompts and routing are data, not code",
        );
        const phases = h(
          "ul",
          { class: "gw-phases", "aria-hidden": "true" },
          top.firstChild,
        );
        const pl = SC.map(() => h("li", {}, phases));

        const holder = h("div", {}, panel);
        const status = h("p", { class: "ag-status", "aria-live": "polite" }, panel);
        const cnt = h(
          "div",
          { class: "ag-counters", role: "status", "aria-live": "polite" },
          panel,
        );
        const cC = h("span", {}, cnt);
        const cD = h("span", {}, cnt);
        const cX = h("span", {}, cnt);
        const ul = h(
          "ol",
          {
            class: "ag-log wide",
            "aria-live": "polite",
            "aria-label": "Config plane log",
          },
          panel,
        );
        const log = logger(ul, 5);
        h(
          "p",
          {
            class: "ag-note",
            text: "Simulated traffic. A rollback is a pointer flip plus a pub/sub fanout: no deploy, no cold start.",
          },
          panel,
        );

        let svg,
          vertical = null,
          opN,
          opPath,
          busPaths = [],
          bus = [],
          rd,
          rp = [],
          toks = [];
        const st = {
          sc: 0,
          i: 0,
          t: 0,
          ph: [],
          cfg: {},
          rep: [],
          hot: -1,
          opHot: false,
          busOn: false,
          applied: [false, false, false],
          flips: 0,
        };

        function counters() {
          cC.textContent = "";
          cD.textContent = "";
          cX.textContent = "";
          h("b", { text: String(st.flips) }, cC);
          cC.append(st.flips === 1 ? " config change" : " config changes");
          h("b", { text: "0" }, cD);
          cD.append(" deploys");
          h("b", { text: "0" }, cX);
          cX.append(" dropped requests");
        }

        function node(parent, cx, cy, w, hh, name, tier, tone) {
          const g = s("g", { transform: `translate(${cx} ${cy})` }, parent);
          const inner = s("g", { class: "ag-chain-node" }, g);
          inner.style.setProperty("--tone", tone);
          s(
            "rect",
            { class: "fill", x: -w / 2, y: -hh / 2, width: w, height: hh, rx: 12 },
            inner,
          );
          const nm = s(
            "text",
            { class: "nm", "text-anchor": "middle", y: hh > 50 ? -6 : -2, text: name },
            inner,
          );
          const tr = s(
            "text",
            { class: "tr", "text-anchor": "middle", y: hh > 50 ? 8 : 12, text: tier },
            inner,
          );
          const stt = s(
            "text",
            { class: "st", "text-anchor": "middle", y: 21 },
            inner,
          );
          return { g: inner, nm, tr, stt };
        }

        function build() {
          const w = holder.clientWidth || 700;
          const v = w < 640;
          if (v === vertical && svg) return;
          vertical = v;
          holder.textContent = "";
          const W = v ? 340 : 1000,
            H = v ? 660 : 330;
          svg = s(
            "svg",
            {
              class: "ag-svg",
              viewBox: `0 0 ${W} ${H}`,
              role: "img",
              "aria-label":
                "An operator flips a pointer in Redis; Redis publishes an invalidate message over pub/sub; three gateway replicas reload their cached prompt and routing policy",
            },
            holder,
          );
          const op = v ? [170, 34, 220, 44] : [240, 36, 190, 46];
          const rx = v ? [170, 170, 300, 168] : [240, 182, 270, 168];
          const rw = v ? 296 : 250,
            rh = 74;
          const rcx = v ? 176 : 800;
          const rys = v ? [400, 500, 600] : [60, 165, 270];
          const rTop = [rx[0], rx[1] - rx[3] / 2];
          opPath = [[op[0], op[1] + op[3] / 2], rTop];
          if (!v) {
            const x0 = rx[0] + rx[2] / 2,
              mid = 520,
              x1 = rcx - rw / 2;
            busPaths = rys.map((y) => [[x0, rx[1]], [mid, rx[1]], [mid, y], [x1, y]]);
          } else {
            const yb = rx[1] + rx[3] / 2,
              yt = yb + 46,
              bx = 14,
              x1 = rcx - rw / 2;
            busPaths = rys.map((y) => [
              [rx[0], yb],
              [rx[0], yt],
              [bx, yt],
              [bx, y],
              [x1, y],
            ]);
          }

          s(
            "line",
            {
              x1: opPath[0][0],
              y1: opPath[0][1],
              x2: opPath[1][0],
              y2: opPath[1][1],
              class: "ag-link",
            },
            svg,
          );
          bus = busPaths.map((p) =>
            s(
              "polyline",
              {
                points: p.map((q) => q.join(",")).join(" "),
                class: "ag-link",
                fill: "none",
              },
              svg,
            ),
          );
          s(
            "text",
            {
              class: "cfg-lbl",
              x: opPath[0][0] + 10,
              y: (opPath[0][1] + opPath[1][1]) / 2 + 3,
              text: "SET pointer",
            },
            svg,
          );
          s(
            "text",
            {
              class: "cfg-lbl",
              "text-anchor": "middle",
              x: v ? 92 : 447,
              y: v ? 292 : rx[1] - 10,
              text: "PUB/SUB",
            },
            svg,
          );

          opN = node(
            svg,
            op[0],
            op[1],
            op[2],
            op[3],
            "Operator",
            "SLO alert or console",
            "var(--c-amber)",
          );

          const rg = s("g", { transform: `translate(${rx[0]} ${rx[1]})` }, svg);
          s(
            "rect",
            {
              class: "cfg-box",
              x: -rx[2] / 2,
              y: -rx[3] / 2,
              width: rx[2],
              height: rx[3],
              rx: 12,
            },
            rg,
          );
          s(
            "text",
            {
              class: "cfg-ttl",
              "text-anchor": "middle",
              y: -rx[3] / 2 + 17,
              text: "REDIS · CONFIG PLANE",
            },
            rg,
          );
          rd = {
            rows: ["PROMPT POINTER", "ROUTING POLICY", "TENANT OVERRIDE"].map(
              (label, i) => {
                const ry = -rx[3] / 2 + 26 + i * 46;
                const rect = s(
                  "rect",
                  {
                    class: "cfg-row",
                    x: -rx[2] / 2 + 10,
                    y: ry,
                    width: rx[2] - 20,
                    height: 40,
                    rx: 8,
                  },
                  rg,
                );
                s(
                  "text",
                  { class: "cfg-lbl", x: -rx[2] / 2 + 20, y: ry + 14, text: label },
                  rg,
                );
                const val = s(
                  "text",
                  { class: "cfg-val", x: -rx[2] / 2 + 20, y: ry + 31 },
                  rg,
                );
                return { rect, val };
              },
            ),
          };

          rp = rys.map((y, i) =>
            node(
              svg,
              rcx,
              y,
              rw,
              rh,
              "Gateway " + REPS[i],
              "",
              "var(--c-teal)",
            ),
          );

          toks = [0, 1, 2, 3].map((i) => {
            const c = s(
              "circle",
              {
                r: 7,
                class: "ag-tok " + (i ? "cfg" : "op"),
                style: "display:none;stroke:var(--surface);stroke-width:2.5",
              },
              svg,
            );
            return c;
          });
          paint();
        }

        function stateText(x) {
          if (x.state === "bad") return ["bad output", "var(--bad)"];
          if (x.state === "slow") return ["provider slow", "var(--c-amber)"];
          if (x.state === "reload") return ["reloading config", "var(--c-amber)"];
          return [x.ov ? "serving · override active" : "serving", "var(--ok)"];
        }

        function paintReps() {
          rp.forEach((r, i) => {
            const x = st.rep[i];
            if (!x) return;
            r.tr.textContent = `prompt ${x.pv} · payroll ${x.rev} → ${x.prov}`;
            const [t, c] = stateText(x);
            r.stt.textContent = t;
            r.stt.style.fill = c;
            r.g.classList.toggle("down", x.state === "bad");
          });
        }

        function paint() {
          pl.forEach((li, i) => li.classList.toggle("on", i <= st.sc));
          const c = st.cfg;
          rd.rows[0].val.textContent = `talent-screening → ${c.pv}`;
          rd.rows[1].val.textContent = `payroll@${c.rev} · primary ${c.prov}`;
          rd.rows[2].val.textContent = c.ov ? "apac-hr → talent-screening@v1" : "none";
          rd.rows.forEach((r, i) => r.rect.classList.toggle("hot", st.hot === i));
          opN.g.classList.toggle("win", st.opHot);
          bus.forEach((b) => b.classList.toggle("on", st.busOn));
          paintReps();
        }

        function place(i, pts, k) {
          const t = toks[i];
          if (!t) return;
          const [x, y] = along(pts, k);
          t.style.display = "block";
          t.setAttribute("cx", x);
          t.setAttribute("cy", y);
        }
        function hideTok(i) {
          if (toks[i]) toks[i].style.display = "none";
        }

        const audit = (c, prompt) =>
          `audit (talent-screening@${prompt || c.pv}, payroll@${c.rev}, ${c.prov}, retry)`;

        const flip = (statusText, cmd, apply, row) => ({
          dur: 950,
          status: statusText,
          enter() {
            st.opHot = true;
            paint();
            log.push([key(K_OP, "operator"), { t: cmd }]);
          },
          update(k) {
            place(0, opPath, ease(k));
          },
          exit() {
            hideTok(0);
            apply(st.cfg);
            st.hot = row;
            st.opHot = false;
            st.flips++;
            counters();
            paint();
          },
        });

        const fan = () => ({
          dur: 1100,
          status:
            "Redis publishes an invalidate message. Every gateway replica drops its cached copy and reloads.",
          enter() {
            st.busOn = true;
            st.applied = [false, false, false];
            paint();
            log.push([
              key(K_RD, "redis"),
              { t: "PUBLISH config:invalidate → 3 gateway replicas" },
            ]);
          },
          update(k) {
            for (let i = 0; i < 3; i++) {
              if (st.applied[i]) continue;
              const ki = clamp((k - i * 0.1) / 0.7, 0, 1);
              place(i + 1, busPaths[i], ease(ki));
              if (ki >= 1) {
                st.applied[i] = true;
                hideTok(i + 1);
                Object.assign(st.rep[i], st.cfg, { state: "reload", flash: 260 });
                paintReps();
              }
            }
          },
          exit() {
            st.busOn = false;
            for (let i = 1; i <= 3; i++) hideTok(i);
            paint();
            log.push([
              key(K_GW, "gateways"),
              { t: "cache invalidated on 3 of 3 replicas · under 200 ms" },
            ]);
          },
        });

        function setReps(state) {
          st.rep.forEach((r) => (r.state = state));
          paintReps();
        }

        function makePhases(id) {
          if (id === 0)
            return [
              {
                dur: 1500,
                status:
                  "Steady state. Every response logs its audit tuple: (prompt, policy, provider, tier).",
                enter() {
                  log.push([key(K_GW, "gateway-a"), { t: audit(st.cfg) }]);
                },
              },
              {
                dur: 1300,
                status:
                  "talent-screening@v3 ships a regression. The output is well-formed but wrong, so the ladder still sees a success.",
                enter() {
                  setReps("bad");
                  log.push([
                    key(K_BAD, "slo"),
                    { t: "invariant failures 18% on talent-screening@v3" },
                  ]);
                },
              },
              flip(
                "The operator flips one pointer in Redis. Nothing is redeployed.",
                "SET prompt:talent-screening:live = v2",
                (c) => (c.pv = "v2"),
                0,
              ),
              fan(),
              {
                dur: 2000,
                status:
                  "The next request is served by v2. Mean time to rollback stays under 5 seconds.",
                enter() {
                  log.push([key(K_GW, "gateway-b"), { t: audit(st.cfg) }]);
                  log.push([
                    key(K_OK, "result"),
                    { t: "rolled back to v2 · no deploy · no dropped requests" },
                  ]);
                },
              },
            ];
          if (id === 1)
            return [
              {
                dur: 1500,
                status: "Steady state on prompt v2. Payroll traffic goes to Gemini first.",
                enter() {
                  log.push([key(K_GW, "gateway-a"), { t: audit(st.cfg) }]);
                },
              },
              {
                dur: 1300,
                status: "Gemini degrades on the payroll domain.",
                enter() {
                  setReps("slow");
                  log.push([
                    key(K_BAD, "gemini"),
                    { t: "payroll p95 14 s · degradation score 14.2" },
                  ]);
                },
              },
              flip(
                "Routing policies are data too. One edit moves the primary provider.",
                "SET routing:payroll = r8 · primary anthropic",
                (c) => {
                  c.rev = "r8";
                  c.prov = "anthropic";
                },
                1,
              ),
              fan(),
              {
                dur: 2000,
                status: "Payroll is now served by Anthropic first. No deploy was needed.",
                enter() {
                  log.push([key(K_GW, "gateway-c"), { t: audit(st.cfg) }]);
                  log.push([
                    key(K_OK, "result"),
                    { t: "primary moved to anthropic · policy r7 → r8 · no deploy" },
                  ]);
                },
              },
            ];
          return [
            {
              dur: 1700,
              status: "Two tenants, one gateway. Both are served by the same prompt version.",
              enter() {
                log.push([
                  key(K_GW, "gateway-a"),
                  { t: "tenant=apac-hr · " + audit(st.cfg) },
                ]);
                log.push([
                  key(K_GW, "gateway-b"),
                  { t: "tenant=acme · " + audit(st.cfg) },
                ]);
              },
            },
            flip(
              "An enterprise tenant needs a pinned prompt. That is a tenant override, also stored in Redis.",
              "SET override:apac-hr = talent-screening@v1",
              (c) => (c.ov = true),
              2,
            ),
            fan(),
            {
              dur: 2200,
              status:
                "Only apac-hr is pinned to v1. Every other tenant keeps the live pointer.",
              enter() {
                log.push([
                  key(K_GW, "gateway-a"),
                  { t: "tenant=apac-hr · " + audit(st.cfg, "v1") },
                ]);
                log.push([
                  key(K_GW, "gateway-b"),
                  { t: "tenant=acme · " + audit(st.cfg) },
                ]);
                log.push([
                  key(K_OK, "result"),
                  { t: "override scoped to apac-hr · other tenants unchanged" },
                ]);
              },
            },
          ];
        }

        function enter(ph) {
          if (ph.status) status.textContent = ph.status;
          if (ph.enter) ph.enter();
        }

        function startScenario() {
          const sc = SC[st.sc];
          st.cfg = { ...sc.init };
          st.rep = REPS.map(() => ({ ...sc.init, state: "ok", flash: 0 }));
          st.hot = -1;
          st.opHot = false;
          st.busOn = false;
          st.i = 0;
          st.t = 0;
          st.ph = makePhases(st.sc);
          for (let i = 0; i < 4; i++) hideTok(i);
          log.push(
            [{ t: "— scenario " + (st.sc + 1) + " of " + SC.length + " · " + sc.name + " —" }],
            "sep",
          );
          paint();
          enter(st.ph[0]);
        }

        build();
        counters();
        if (window.ResizeObserver)
          new ResizeObserver(() => build()).observe(holder);
        startScenario();

        return {
          root: panel,

          // Frozen but representative state for prefers-reduced-motion.
          still() {
            st.sc = 0;
            startScenario();
            st.cfg.pv = "v2";
            st.rep.forEach((r) => {
              r.pv = "v2";
              r.state = "ok";
            });
            st.hot = 0;
            st.flips = 1;
            counters();
            paint();
            status.textContent =
              "Animation is off because reduced motion is on. Prompts, routing policies and tenant overrides live in Redis. Shown here: the prompt pointer was flipped from v3 to v2 and all three gateway replicas reloaded it.";
          },

          tick(dt) {
            let dirty = false;
            for (const r of st.rep)
              if (r.flash > 0) {
                r.flash -= dt;
                if (r.flash <= 0) {
                  r.flash = 0;
                  r.state = "ok";
                  dirty = true;
                }
              }
            if (dirty) paintReps();
            st.t += dt;
            const ph = st.ph[st.i];
            if (!ph) return;
            const k = Math.min(1, st.t / ph.dur);
            if (ph.update) ph.update(k);
            if (k >= 1) {
              if (ph.exit) ph.exit();
              st.i++;
              st.t = 0;
              if (st.i >= st.ph.length) {
                st.sc = (st.sc + 1) % SC.length;
                startScenario();
              } else enter(st.ph[st.i]);
            }
          },
        };
      }

      run(mountConfig(document.getElementById("p5")));
    })();

  </script>
  <script>
    if (window.self !== window.top) document.body.style.minHeight = "auto";
  </script>
  <script>
    (function () {
      function applyJuh(s) { document.documentElement.setAttribute('data-juh', s); }
      window.addEventListener('message', function (e) {
        if (e.data && e.data.type === 'juh-theme') applyJuh(e.data.scheme);
      });
      try { if (window.parent !== window) window.parent.postMessage({ type: 'juh-theme-ready' }, '*'); } catch (x) { }
    })();
  </script>
    <script>
      (function () {
        if (window.parent === window) return;
        var raf = 0, last = 0;
        function report() {
          raf = 0;
          var h = Math.ceil(document.body.getBoundingClientRect().height);
          if (h && h !== last) {
            last = h;
            try { window.parent.postMessage({ type: 'juh-diagram-height', height: h }, '*'); } catch (x) {}
          }
        }
        function queue() { if (!raf) raf = requestAnimationFrame(report); }
        if (window.ResizeObserver) new ResizeObserver(queue).observe(document.body);
        window.addEventListener('load', queue);
        window.addEventListener('resize', queue);
        queue();
      })();
    </script>
</body>
