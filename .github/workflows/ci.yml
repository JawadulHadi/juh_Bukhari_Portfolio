name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Syntax check & smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PORT: 3000
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install wait-on
        run: npm install --no-save wait-on

      - name: Syntax check
        shell: bash
        run: |
          set -euo pipefail
          for f in server.js api/*.js theme.js certs.js scripts/prerender.js; do
            node --check "$f"
          done

      - name: Pre-rendered HTML is up to date
        run: node scripts/prerender.js --check

      - name: Start server
        shell: bash
        run: |
          set -euo pipefail
          PORT="$PORT" node server.js > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT

          echo "Waiting for server on http://localhost:$PORT ..."
          npx wait-on "http://localhost:$PORT/" --timeout 60000 || {
            echo "Server failed to start within 60s"
            echo "---- server.log ----"
            sed -n '1,200p' server.log || true
            exit 1
          }

      - name: Root endpoint responds
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/root.out -w '%{http_code}' "http://localhost:$PORT/")
          echo "GET / -> $code"
          [ "$code" = "200" ]

      - name: Pages are served
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local path="$1"
            local expected="$2"
            local code
            code=$(curl -sS -o /tmp/response.out -w '%{http_code}' "http://localhost:$PORT$path")
            echo "$path -> $code"
            [ "$code" = "$expected" ]
          }

          check "/" 200
          check "/case-study" 200
          check "/credentials" 200
          check "/resume.pdf" 200
          check "/theme.js" 200
          check "/certs.js" 200
          check "/favicon.svg" 200

      - name: Security headers present
        shell: bash
        run: |
          set -euo pipefail
          headers=$(curl -fsSLI "http://localhost:$PORT/" | tr '[:upper:]' '[:lower:]')
          echo "$headers"
          echo "$headers" | grep -Eq 'permissions-policy: .*microphone=(self)'
          echo "$headers" | grep -Eq 'x-content-type-options: nosniff'

      - name: Agent returns 503 without an API key
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/agent.out -w '%{http_code}' -X POST "http://localhost:$PORT/api/agent" \
            -H 'Content-Type: application/json' \
            -d '{"messages":[{"role":"user","content":"hi"}]}')
          echo "POST /api/agent -> $code"
          [ "$code" = "503" ]

      - name: Agent health endpoint
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/agent-health.out -w '%{http_code}' "http://localhost:$PORT/api/agent")
          echo "GET /api/agent -> $code"
          [ "$code" = "503" ]

      - name: Server log
        if: always()
        shell: bash
        run: |
          echo "---- server.log ----"
          sed -n '1,200p' server.log || true
