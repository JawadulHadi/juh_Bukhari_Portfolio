<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Credentials waffle</title>
    <style>
      :root {
        --bg: #f2f4fa;
        --surface: #fff;
        --surface-2: #e8ecf6;
        --ink: #10162a;
        --dim: #535d77;
        --line: #d6dcea;
        --grid: #cdd4e6;
        --c-blue: #2d5bef;
        --c-teal: #0a9a8c;
        --c-amber: #c47600;
        --c-coral: #e5482e;
        --c-magenta: #cc2f86;
        --c-violet: #6b47ee;
        --c-lime: #4b9a1c;
        --c-rose: #db2777;
        --c-green: #16a34a;
        --c-sand: #92400e;
        --ok: #148a4d;
        --bad: #d7363c;
        --on-tone: #fff;
        --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
        --font-display:
          "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
        --font-body:
          "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
        --font-mono:
          "Martian Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0f1e;
          --surface: #111930;
          --surface-2: #1a2440;
          --ink: #e9edf8;
          --dim: #9aa5c0;
          --line: #26314f;
          --grid: #1c2643;
          --c-blue: #7090ff;
          --c-teal: #2ccdbb;
          --c-amber: #f5b83d;
          --c-coral: #ff7a62;
          --c-magenta: #f168b3;
          --c-violet: #a08bff;
          --c-lime: #8ad15a;
          --c-rose: #f472b6;
          --c-green: #4ade80;
          --c-sand: #d97706;
          --ok: #3dd68c;
          --bad: #ff6369;
          --on-tone: #0a0f1e;
        }
      }
      /* Portfolio theme override: wins over the media query above */
      :root[data-juh="dark"] {
        --bg: #0a0f1e;
        --surface: #111930;
        --surface-2: #1a2440;
        --ink: #e9edf8;
        --dim: #9aa5c0;
        --line: #26314f;
        --grid: #1c2643;
        --c-blue: #7090ff;
        --c-teal: #2ccdbb;
        --c-amber: #f5b83d;
        --c-coral: #ff7a62;
        --c-magenta: #f168b3;
        --c-violet: #a08bff;
        --c-lime: #8ad15a;
        --c-rose: #f472b6;
        --c-green: #4ade80;
        --c-sand: #d97706;
        --ok: #3dd68c;
        --bad: #ff6369;
        --on-tone: #0a0f1e;
      }
      :root[data-juh="light"] {
        --bg: #f2f4fa;
        --surface: #fff;
        --surface-2: #e8ecf6;
        --ink: #10162a;
        --dim: #535d77;
        --line: #d6dcea;
        --grid: #cdd4e6;
        --c-blue: #2d5bef;
        --c-teal: #0a9a8c;
        --c-amber: #c47600;
        --c-coral: #e5482e;
        --c-magenta: #cc2f86;
        --c-violet: #6b47ee;
        --c-lime: #4b9a1c;
        --c-rose: #db2777;
        --c-green: #16a34a;
        --c-sand: #92400e;
        --ok: #148a4d;
        --bad: #d7363c;
        --on-tone: #fff;
      }

      *,
      :before,
      :after {
        box-sizing: border-box;
        border-style: solid;
        border-width: 0;
        border-color: var(--line);
      }

      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-size: inherit;
        font-weight: inherit;
        margin: 0;
      }

      p {
        margin: 0;
      }

      ol,
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        cursor: pointer;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-body);
        font-size: 15px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        padding: 24px;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }

      .waffle-wrap {
        align-content: start;
        gap: 16px;
        display: grid;
        min-width: 0;
        width: min(720px, 100%);
      }

      .waffle-head {
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 14px;
        display: flex;
      }

      .figure {
        font-family: var(--font-display);
        letter-spacing: -0.03em;
        font-variant-numeric: tabular-nums;
        color: var(--tone, var(--ink));
        font-size: clamp(2.3rem, 1.9rem + 1.4vw, 3.1rem);
        font-weight: 800;
        font-stretch: 125%;
        line-height: 1;
        display: inline-block;
      }

      .waffle-head .figure {
        --tone: var(--c-blue);
      }

      .dim {
        color: var(--dim);
      }

      .waffle {
        grid-template-columns: repeat(18, minmax(0, 1fr));
        gap: 4px;
        display: grid;
      }

      .cell {
        aspect-ratio: 1;
        background: var(--tone);
        border-radius: 4px;
        max-width: 100%;
        transition:
          opacity 0.2s,
          transform 0.2s;
        animation: pop 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.3) backwards;
        animation-delay: calc(var(--i) * 16ms);
      }

      .waffle.focused .cell:not(.hit) {
        opacity: 0.15;
      }

      .waffle.focused .cell.hit {
        transform: scale(1.08);
      }

      @keyframes pop {
        0% {
          transform: translateY(6px) scale(0.7);
        }

        to {
          transform: none;
        }
      }

      .legend {
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 6px;
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
      }

      .legend button {
        border: 1px solid var(--line);
        background: var(--surface);
        width: 100%;
        color: var(--ink);
        font: inherit;
        text-align: left;
        cursor: pointer;
        border-radius: 10px;
        grid-template-columns: 12px minmax(0, 1fr) auto;
        align-items: center;
        column-gap: 9px;
        padding: 8px 10px;
        font-size: 13px;
        transition:
          border-color 0.2s,
          background 0.2s;
        display: grid;
      }

      .legend button:hover,
      .legend button:focus-visible {
        border-color: var(--tone);
        background: color-mix(in srgb, var(--tone) 9%, var(--surface));
      }

      .legend i {
        background: var(--tone);
        border-radius: 3px;
        width: 12px;
        height: 12px;
      }

      .legend-name {
        font-weight: 600;
      }

      .legend-count {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        font-size: 12px;
      }

      .legend-sub {
        color: var(--dim);
        grid-column: 2/-1;
        font-size: 11.5px;
      }

      .sr-only {
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border-width: 0;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        position: absolute;
        overflow: hidden;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
        }
      }
    </style>
      <script>
      (function () {
        var root = document.documentElement;
        window.addEventListener("message", function (e) {
          if (e.source !== window.parent) return;
          var d = e.data;
          if (!d || d.type !== "juh-theme") return;
          if (d.scheme === "dark" || d.scheme === "light")
            root.setAttribute("data-juh", d.scheme);
        });
        if (window.parent !== window)
          window.parent.postMessage({ type: "juh-theme-ready" }, "*");
      })();
    </script>
  </head>

  <body>
    <div class="waffle-wrap">
      <div class="waffle-head">
        <span class="figure"><span id="fig" aria-hidden="true">0</span><span class="sr-only">74</span></span>
        <span class="dim">verified credentials, one square each</span>
      </div>
      <div class="waffle" id="waffle" role="img" aria-label="74 squares coloured by issuer, one per verified credential"></div>
      <ul class="legend" id="legend"></ul>
    </div>
    <script>
      (() => {
        const R = [
          { name: "LinkedIn Learning", count: 23, color: "var(--c-blue)" },
          {
            name: "Google Cloud Skills Boost",
            count: 21,
            color: "var(--c-lime)",
          },
          { name: "IBM", count: 14, color: "var(--c-teal)" },
          { name: "Anthropic", count: 7, color: "var(--c-coral)" },
          {
            name: "Microsoft Learning",
            count: 6,
            color: "var(--c-amber)",
          },
          { name: "Coursera", count: 1, color: "var(--c-magenta)" },
          { name: "Cognitive Class", count: 1, color: "var(--c-rose)" },
          { name: "Udemy", count: 1, color: "var(--c-sand)" },
        ];
        const TOTAL = R.reduce((a, b) => a + b.count, 0);
        const cells = R.flatMap((r) => Array.from({ length: r.count }, () => r));
        const waffle = document.getElementById("waffle");
        const legend = document.getElementById("legend");
        const fig = document.getElementById("fig");

        let t0 = performance.now();
        function anim(now) {
          const k = Math.min(1, (now - t0) / 1200);
          fig.textContent = Math.round(TOTAL * (1 - Math.pow(1 - k, 3)));
          if (k < 1) requestAnimationFrame(anim);
        }
        requestAnimationFrame(anim);

        cells.forEach((r, i) => {
          const c = document.createElement("span");
          c.className = "cell";
          c.style.setProperty("--tone", r.color);
          c.style.setProperty("--i", i);
          c.dataset.issuer = r.name;
          waffle.appendChild(c);
        });

        let focus = null;
        R.forEach((r) => {
          const li = document.createElement("li");
          const btn = document.createElement("button");
          btn.type = "button";
          btn.style.setProperty("--tone", r.color);
          btn.setAttribute("aria-label", `Highlight ${r.name}, ${r.count}`);
          btn.innerHTML = `<i aria-hidden="true"></i><span class="legend-name">${r.short ?? r.name}</span><span class="legend-count">${r.count}</span>${r.short ? `<span class="legend-sub">${r.name}</span>` : ""}`;
          const on = () => {
            if (focus === r.name) return;
            focus = r.name;
            waffle.classList.add("focused");
            waffle
              .querySelectorAll(".cell")
              .forEach((c) => c.classList.toggle("hit", c.dataset.issuer === r.name));
          };
          const off = () => {
            if (focus !== r.name) return;
            focus = null;
            waffle.classList.remove("focused");
            waffle
              .querySelectorAll(".cell")
              .forEach((c) => c.classList.remove("hit"));
          };
          btn.addEventListener("mouseenter", on);
          btn.addEventListener("mouseleave", off);
          btn.addEventListener("focus", on);
          btn.addEventListener("blur", off);
          li.appendChild(btn);
          legend.appendChild(li);
        });
      })();
    </script>
    <script>
      if (window.self !== window.top) document.body.style.minHeight = "auto";
    </script>
  </body>

</html>
