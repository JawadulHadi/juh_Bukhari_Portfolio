<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM fallback chain</title>
<style>
:root{--bg:#f2f4fa;--surface:#fff;--surface-2:#e8ecf6;--ink:#10162a;--dim:#535d77;--line:#d6dcea;--grid:#cdd4e6;
--c-blue:#2d5bef;--c-teal:#0a9a8c;--c-amber:#c47600;--c-coral:#e5482e;--c-magenta:#cc2f86;--c-violet:#6b47ee;--c-lime:#4b9a1c;
--ok:#148a4d;--bad:#d7363c;--on-tone:#fff;--ease-out:cubic-bezier(.2,.8,.2,1);
--font-display:"Archivo","Arial Narrow","Helvetica Neue",Arial,sans-serif;
--font-body:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
--font-mono:"Martian Mono",ui-monospace,"Cascadia Mono",Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0a0f1e;--surface:#111930;--surface-2:#1a2440;--ink:#e9edf8;--dim:#9aa5c0;--line:#26314f;--grid:#1c2643;
--c-blue:#7090ff;--c-teal:#2ccdbb;--c-amber:#f5b83d;--c-coral:#ff7a62;--c-magenta:#f168b3;--c-violet:#a08bff;--c-lime:#8ad15a;
--ok:#3dd68c;--bad:#ff6369;--on-tone:#0a0f1e}}
*,:before,:after{box-sizing:border-box;border-style:solid;border-width:0;border-color:var(--line)}
h1,h2,h3,h4,h5,h6{font-size:inherit;font-weight:inherit;margin:0}p{margin:0}ol,ul{list-style:none;margin:0;padding:0}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}svg{display:block}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;padding:24px;display:grid;place-items:center;min-height:100vh}
.ag-panel{container-type:inline-size;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:18px;display:grid;gap:12px;align-content:start;min-width:0;width:min(1000px,100%)}
.ag-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ag-top .h3{margin-top:4px}
.gw-phases{gap:4px;margin:4px 0 0;padding:0;list-style:none;display:flex}
.gw-phases li{background:var(--surface-2);border-radius:3px;width:16px;height:5px;transition:background .3s}
.gw-phases li.on{background:var(--ink)}
.ag-svg{width:100%;height:auto;display:block;overflow:visible}
.ag-chain-node rect.fill{fill:color-mix(in srgb,var(--tone) 9%,var(--surface));stroke:var(--tone);stroke-width:1.5;transition:fill .25s,stroke .25s}
.ag-chain-node.down rect.fill{stroke:var(--bad);stroke-dasharray:4 4;fill:color-mix(in srgb,var(--bad) 7%,var(--surface))}
.ag-chain-node.win rect.fill{fill:var(--tone)}
.ag-chain-node.win text{fill:var(--on-tone)}
.ag-chain-node .nm{fill:var(--ink);font:650 13.5px var(--font-body);transition:fill .25s}
.ag-chain-node .tr{fill:var(--dim);font:500 9px var(--font-mono);transition:fill .25s}
.ag-chain-node .st{font:600 9px var(--font-mono);transition:fill .25s}
.ag-chain-node.shake{animation:agShake .32s ease-in-out}
.ag-link{stroke:var(--line);stroke-width:2}
.ag-tok{fill:var(--ink)}
.ag-tok.back{fill:var(--ok)}
.ag-counters{display:flex;flex-wrap:wrap;gap:6px}
.ag-counters span{font-family:var(--font-mono);font-size:11px;background:var(--surface-2);border-radius:999px;padding:3px 10px}
.ag-counters b{font-weight:600}
.ag-status{margin:0;min-height:2.6em;color:var(--dim);font-size:13.5px}
.ag-log{list-style:none;margin:0;padding:10px 12px;background:var(--surface-2);border-radius:10px;font-family:var(--font-mono);font-size:10.5px;line-height:1.45;display:grid;gap:3px;align-content:end;overflow:hidden}
.ag-log li{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px;overflow-wrap:anywhere;animation:agIn .35s var(--ease-out) backwards}
.ag-log li.sep{display:block;color:var(--dim);opacity:.7}
.ag-k{font-weight:600}
.ag-note{color:var(--dim);font-size:13px;margin:0}
@keyframes agIn{from{opacity:0;transform:translateY(4px)}}
@keyframes agShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.eyebrow{font-family:var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:0;font-size:10.5px;font-weight:500}
.h3{font-family:var(--font-display);margin:0;font-size:1.1rem;font-weight:700;font-stretch:100%;line-height:1.25}
.role-tag{background:color-mix(in srgb,var(--role) 13%,transparent);color:var(--ink);font-family:var(--font-mono);white-space:nowrap;border-radius:6px;flex:none;align-items:center;gap:6px;padding:3px 8px;font-size:10px;font-weight:500;display:inline-flex}
.role-tag:before{content:"";background:var(--role);border-radius:50%;width:7px;height:7px}
</style>
</head>
<body>
<div class="ag-panel" id="p3"></div>
<script>
(() => {
  "use strict";
  const NS="http://www.w3.org/2000/svg";
  const RM=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  function s(tag,a,p){const n=document.createElementNS(NS,tag);for(const k in a||{}){if(k==="text")n.textContent=a[k];else n.setAttribute(k,a[k]);}if(p)p.appendChild(n);return n}
  function h(tag,a,p){const n=document.createElement(tag);for(const k in a||{}){if(k==="text")n.textContent=a[k];else n.setAttribute(k,a[k]);}if(p)p.appendChild(n);return n}
  const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  const lerp=(a,b,t)=>a+(b-a)*t;
  const live=new Set();let raf=0,last=0;
  function frame(t){const dt=Math.min(64,last?t-last:16);last=t;for(const c of live){if(!c.root.isConnected){live.delete(c);continue}if(!document.hidden&&c.visible)c.tick(dt)}if(live.size)raf=requestAnimationFrame(frame);else{raf=0;last=0}}
  const io="IntersectionObserver"in window?new IntersectionObserver(es=>{for(const e of es){const c=e.target.__ag;if(c)c.visible=e.isIntersecting}},{rootMargin:"80px"}):null;
  function run(c){c.visible=!io;c.root.__ag=c;if(io)io.observe(c.root);if(RM){c.still&&c.still();return}live.add(c);if(!raf)raf=requestAnimationFrame(frame)}
  function logger(ul,max){return{push(parts,cls){const li=h("li",cls?{class:cls}:{},ul);for(const p of parts){const n=h(p.code?"code":"span",p.cls?{class:p.cls}:{},li);n.textContent=p.t;if(p.c)n.style.color=p.c}while(ul.children.length>max)ul.removeChild(ul.firstChild)},clear(){ul.textContent=""}}}
  function panelHead(panel,eyebrow,title){const top=h("div",{class:"ag-top"},panel);const d=h("div",{},top);h("p",{class:"eyebrow",text:eyebrow},d);h("h3",{class:"h3",text:title},d);const tag=h("span",{class:"role-tag",text:"Backend Lead"},top);tag.style.setProperty("--role","var(--c-blue)");return top}

  const CHAIN=[
    {id:"req",name:"Agent call",tier:"request in",tone:"var(--ink)"},
    {id:"openai",name:"OpenAI",tier:"Tier 1 · Retry",tone:"var(--c-teal)",prov:1},
    {id:"gemini",name:"Gemini",tier:"Tier 1 · Retry",tone:"var(--c-blue)",prov:1},
    {id:"anthropic",name:"Anthropic",tier:"Tier 1 · Retry",tone:"var(--c-coral)",prov:1},
    {id:"rag",name:"RAG Fallback",tier:"Tier 2",tone:"var(--c-violet)"},
    {id:"floor",name:"Rule-Based Floor",tier:"Tier 3",tone:"var(--c-amber)"}];
  const SCEN=[
    {down:[],text:"All providers healthy. OpenAI answers on the first try."},
    {down:["openai"],text:"OpenAI outage. Two retries, its breaker opens, the call moves to Gemini."},
    {down:["openai","gemini"],text:"Two providers down. Anthropic carries the call."},
    {down:["openai","gemini","anthropic"],text:"Every LLM provider down. The RAG Fallback answers from indexed context."},
    {down:["openai","gemini","anthropic","rag"],text:"RAG unavailable as well. The Rule-Based Floor still returns a safe answer."}];
  function mountChain(panel){
    const top=panelHead(panel,"LLM fallback chain · from “Designing for AI Failure”","Retry → RAG Fallback → Rule-Based Floor");
    const phases=h("ul",{class:"gw-phases","aria-hidden":"true"},top.firstChild);const pl=SCEN.map(()=>h("li",{},phases));
    const holder=h("div",{},panel);
    const status=h("p",{class:"ag-status","aria-live":"polite"},panel);
    const cnt=h("div",{class:"ag-counters"},panel);
    const cA=h("span",{},cnt);const cF=h("span",{},cnt);const cR=h("span",{},cnt);
    const ul=h("ol",{class:"ag-log wide"},panel);const log=logger(ul,5);
    h("p",{class:"ag-note",text:"Simulated traffic. Breakers reset to half-open, then closed, before each new scenario."},panel);
    let svg,nodes={},tok,vertical=null,pos=[];
    const st={sc:0,idx:0,mode:"travel",t:0,retry:0,answered:0,retries:0,back:null};
    function counters(){cA.innerHTML="";cF.innerHTML="";cR.innerHTML="";h("b",{text:String(st.answered)},cA);cA.append(" answered");h("b",{text:"0"},cF);cF.append(" failed");h("b",{text:String(st.retries)},cR);cR.append(" retries")}
    function build(){const w=holder.clientWidth||700;const v=w<640;if(v===vertical&&svg)return;vertical=v;holder.textContent="";nodes={};
      const W=v?340:1000,H=v?600:150,nw=v?224:142,nh=60;
      svg=s("svg",{class:"ag-svg",viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":"A request moving along the fallback chain: OpenAI, Gemini, Anthropic, RAG Fallback, Rule-Based Floor"},holder);
      pos=CHAIN.map((c,i)=>v?[W/2,48+i*100]:[82+i*167,H/2]);
      for(let i=0;i<pos.length-1;i++)s("line",{x1:pos[i][0],y1:pos[i][1],x2:pos[i+1][0],y2:pos[i+1][1],class:"ag-link"},svg);
      tok=s("circle",{r:8,class:"ag-tok",style:"stroke:var(--surface);stroke-width:2.5"},svg);
      CHAIN.forEach((c,i)=>{const[x,y]=pos[i];const g=s("g",{transform:`translate(${x} ${y})`},svg);
        const inner=s("g",{class:"ag-chain-node"},g);inner.style.setProperty("--tone",c.tone);
        s("rect",{class:"fill",x:-nw/2,y:-nh/2,width:nw,height:nh,rx:12},inner);
        s("text",{class:"nm","text-anchor":"middle",y:-6,text:c.name},inner);
        s("text",{class:"tr","text-anchor":"middle",y:8,text:c.tier},inner);
        const stt=s("text",{class:"st","text-anchor":"middle",y:21},inner);
        nodes[c.id]={c,g:inner,stt}});
      paint()}
    function stateOf(id){const sc=SCEN[st.sc],c=nodes[id].c;
      if(id==="req")return["",""];
      if(c.prov){if(sc.down.includes(id)&&nodes[id].tripped)return["breaker: open","var(--bad)"];
        if(nodes[id].half)return["breaker: half-open","var(--c-amber)"];return["breaker: closed","var(--ok)"]}
      if(id==="rag")return sc.down.includes("rag")&&nodes[id].tripped?["unavailable","var(--bad)"]:["ready","var(--ok)"];
      return["always on","var(--ok)"]}
    function paint(){const sc=SCEN[st.sc];pl.forEach((li,i)=>li.classList.toggle("on",i<=st.sc));
      for(const id in nodes){const n=nodes[id];const[t,c]=stateOf(id);n.stt.textContent=t;n.stt.style.fill=c;
        n.g.classList.toggle("down",!!(sc.down.includes(id)&&n.tripped));n.g.classList.toggle("win",st.win===id)}}
    function shake(id){const g=nodes[id].g;g.classList.remove("shake");void g.getBBox();g.classList.add("shake")}
    function startScenario(){const sc=SCEN[st.sc];st.idx=0;st.mode="travel";st.t=0;st.win=null;
      for(const id in nodes){nodes[id].tripped=false;nodes[id].half=false}
      status.textContent=sc.text;log.push([{t:"— scenario "+(st.sc+1)+" of "+SCEN.length+" —"}],"sep");paint()}
    function place(x,y){tok.setAttribute("cx",x);tok.setAttribute("cy",y)}
    build();counters();
    if(window.ResizeObserver)new ResizeObserver(()=>{const was=vertical;build();if(was!==vertical){place(...pos[st.idx])}}).observe(holder);
    startScenario();place(...pos[0]);
    return{root:panel,
      still(){status.textContent="Animation is off because reduced motion is on. The chain runs Retry across OpenAI, Gemini and Anthropic, then the RAG Fallback, then the Rule-Based Floor."},
      tick(dt){st.t+=dt;const sc=SCEN[st.sc];
        if(st.mode==="travel"){const a=pos[st.idx],b=pos[st.idx+1],k=Math.min(1,st.t/560),e=ease(k);tok.classList.remove("back");
          place(lerp(a[0],b[0],e),lerp(a[1],b[1],e));
          if(k>=1){st.t=0;st.idx++;const id=CHAIN[st.idx].id;
            if(sc.down.includes(id)){st.mode="fail";st.retry=0;shake(id);
              log.push([{t:id,cls:"ag-k",c:CHAIN[st.idx].tone},{t:CHAIN[st.idx].prov?"503 · attempt 1 failed":"index unreachable"}])}
            else{st.mode="answer";st.win=id;paint();
              log.push([{t:id,cls:"ag-k",c:CHAIN[st.idx].tone},{t:"200 · answered ("+CHAIN[st.idx].tier+")"}])}}}
        else if(st.mode==="fail"){const id=CHAIN[st.idx].id,prov=CHAIN[st.idx].prov;
          if(prov&&st.retry<2&&st.t>420){st.t=0;st.retry++;st.retries++;counters();shake(id);
            log.push([{t:id,cls:"ag-k",c:CHAIN[st.idx].tone},{t:`retry ${st.retry} · backoff ×${st.retry*2} → failed`}])}
          else if((!prov||st.retry>=2)&&st.t>420){nodes[id].tripped=true;paint();
            log.push([{t:id,cls:"ag-k",c:"var(--bad)"},{t:prov?"breaker open → next provider":"skip → next tier"}]);st.t=0;st.mode="travel"}}
        else if(st.mode==="answer"){if(st.t>520){st.t=0;st.mode="return";tok.classList.add("back");st.back=st.idx}}
        else if(st.mode==="return"){const span=st.back*200,k=Math.min(1,st.t/span),f=st.back*(1-ease(k)),i=Math.floor(f),r=f-i;
          const a=pos[i],b=pos[Math.min(i+1,pos.length-1)];place(lerp(a[0],b[0],r),lerp(a[1],b[1],r));
          if(k>=1){st.t=0;st.mode="rest";st.answered++;counters();log.push([{t:"agent call",cls:"ag-k"},{t:"response delivered ✓"}])}}
        else if(st.mode==="rest"){if(st.t>1500){st.t=0;tok.classList.remove("back");
            for(const id in nodes)if(nodes[id].tripped&&nodes[id].c.prov){nodes[id].tripped=false;nodes[id].half=true}
            st.win=null;paint();st.mode="probe"}}
        else if(st.mode==="probe"){if(st.t>700){st.sc=(st.sc+1)%SCEN.length;startScenario()}}
      }};
  }
  run(mountChain(document.getElementById("p3")));
})();
</script>
  <script>if(window.self!==window.top)document.body.style.minHeight='auto'</script>
</body>
</html>
